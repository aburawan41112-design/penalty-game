<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح - أ. عبد الله عكور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1e1035; color: #ffffff; user-select: none; overflow-x: hidden; }
        .purple-backdrop { background: radial-gradient(circle at top, #3b1d6e 0%, #1e1035 55%, #130924 100%); min-height: 100vh; }
        .quiz-main-card { background-color: #11221c; border: 3px solid #23473a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75); }
        .side-img-right { background: linear-gradient(180deg, rgba(6,78,59,0.3), rgba(6,78,59,0.7)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=500&auto=format&fit=crop') center/cover no-repeat; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .side-img-left { background: linear-gradient(180deg, rgba(6,78,59,0.3), rgba(6,78,59,0.7)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=500&auto=format&fit=crop') center/cover no-repeat; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .goal-frame { border-top: 10px solid #f8fafc; border-left: 10px solid #f8fafc; border-right: 10px solid #f8fafc; box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5); background-color: rgba(6, 78, 59, 0.55); background-image: linear-gradient(0deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px); background-size: 16px 16px; position: relative; }
        .corner-btn { background: rgba(255, 255, 255, 0.96); color: #064e3b; border: 3px solid #ffffff; box-shadow: 0 8px 20px rgba(0,0,0,0.45); transition: all 0.2s; cursor: pointer; }
        .corner-btn:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
        @keyframes fireworks { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .firework { position: absolute; width: 12px; height: 12px; border-radius: 50%; animation: fireworks 1s infinite; }
    </style>
</head>
<body class="purple-backdrop flex flex-col justify-between items-center p-3 md:p-5">

    <header class="w-full max-w-7xl bg-[#2a174a]/90 backdrop-blur-md px-5 py-3 rounded-2xl shadow-lg flex justify-between items-center border border-purple-400/30 z-40">
        <span class="text-xs md:text-sm font-black text-white">أ. عبد الله محمد عكور</span>
        <span class="bg-emerald-600 text-white text-xs font-black px-3.5 py-1 rounded-full shadow">الصف الثالث الابتدائي • ثالث ١</span>
    </header>

    <main class="w-full max-w-7xl flex-1 grid grid-cols-1 lg:grid-cols-5 gap-4 items-center my-4 z-20">
        <div class="hidden lg:flex lg:col-span-1 h-[680px] rounded-3xl side-img-right flex-col justify-end p-4 text-center">
            <span class="bg-black/60 text-white text-xs font-bold py-1.5 px-3 rounded-xl backdrop-blur-sm">ملعب ركلات الترجيح ⚽</span>
        </div>

        <div id="app-center" class="lg:col-span-3 quiz-main-card rounded-3xl p-5 md:p-7 text-center space-y-5 text-white relative overflow-hidden"></div>

        <div class="hidden lg:flex lg:col-span-1 h-[680px] rounded-3xl side-img-left flex-col justify-end p-4 text-center">
            <span class="bg-black/60 text-white text-xs font-bold py-1.5 px-3 rounded-xl backdrop-blur-sm">منطقة التتويج 🏆</span>
        </div>
    </main>

    <!-- نافذة الرقم السري للمعلم -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#241342] border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl text-white">
            <h3 class="text-lg font-black text-amber-400">🔐 لوحة تحكم المعلم</h3>
            <p class="text-xs text-purple-200">أدخل الرقم السري للتحكم (4112):</p>
            <input type="password" id="pin-box" placeholder="••••" class="w-full bg-[#150a29] border border-purple-500 rounded-xl px-4 py-2.5 text-center text-white font-black text-xl tracking-widest">
            <div class="flex gap-2">
                <button onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 text-white font-black py-2.5 rounded-xl text-xs">دخول</button>
                <button onclick="document.getElementById('pin-modal').classList.add('hidden')" class="bg-purple-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://penalty-2026-default-rtdb.firebaseio.com/" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        const studentsList = [
            "أديب عبدالله العمري", "بتال الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شريان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        const teamColorPalette = [
            { name: "أزرق", hex: "#2563eb" },
            { name: "أحمر", hex: "#dc2626" },
            { name: "أصفر", hex: "#eab308" },
            { name: "أخضر", hex: "#16a34a" },
            { name: "برتقالي", hex: "#ea580c" },
            { name: "بنفسجي", hex: "#9333ea" },
            { name: "سماوي", hex: "#0891b2" },
            { name: "وردي", hex: "#db2777" }
        ];

        const lughatiBank = [
            { text: "كلمة (الشَّمْس) تبدأ بلام شمسية تُكتب ولا تُنطق.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "كلمة (القَمَر) تبدأ بلام قمرية تُكتب وتُنطق وتكون ساكنة.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "مفرد كلمة (عَصَافِير) هو:", options: ["عُصْفُورَة", "عُصْفُور", "عَصْفَرَة", "عَصَافِر"], correctIndex: 1 },
            { text: "جمع كلمة (مَدْرَسَة) هو:", options: ["مُدَرِّسُون", "مَدَارِس", "دُرُوس", "دَارِسُون"], correctIndex: 1 },
            { text: "التاء المربوطة (ة) تُنطق هاءً عند الوقف وتاءً عند الوصل.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "نوع كلمة (يَكْتُبُ) من أقسام الكلمة:", options: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "حرف جر"], correctIndex: 1 },
            { text: "نوع كلمة (كَتَبَ) من أقسام الكلمة:", options: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "اسم"], correctIndex: 0 },
            { text: "نوع كلمة (اُكْتُبْ) من أقسام الكلمة:", options: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "اسم"], correctIndex: 2 },
            { text: "اسم الإشارة المناسب للمفرد المذكر (.... تلميذ مجتهد):", options: ["هذا", "هذه", "هؤلاء", "هاتان"], correctIndex: 0 },
            { text: "اسم الإشارة المناسب للمفرد المؤنث (.... معلمة متميزة):", options: ["هذا", "هذه", "هؤلاء", "هذان"], correctIndex: 1 },
            { text: "ضمير المتكلم المناسب للمفرد (.... أحب وطني):", options: ["أنا", "نحن", "هو", "هي"], correctIndex: 0 },
            { text: "ضد كلمة (نَظِيف) هو:", options: ["جَمِيل", "مُتَّسِخ", "كَبِير", "سَرِيع"], correctIndex: 1 },
            { text: "ضد كلمة (طَوِيل) هو:", options: ["قَصِير", "عَرِيض", "سَمِين", "كَبِير"], correctIndex: 0 }
        ];

        const islamicBank = [
            { text: "مراتب الدين الإسلامي ثلاث مراتب هي: الإسلام، الإيمان، الإحسان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "أعظم مراتب الدين هو الإحسان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "عدد أركان الإسلام خمسة أركان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "الركن الأول من أركان الإسلام هو الشهادتان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "الركن الثاني من أركان الإسلام هو إقام الصلاة.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "الطهارة والوضوء شرط لصحة الصلاة.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "عدد الصلوات المفروضة في اليوم والليلة خمس صلوات.", options: ["صح", "خطأ"], correctIndex: 0 },
            { text: "من آداب دخول المسجد تقديم الرجل اليمنى.", options: ["صح", "خطأ"], correctIndex: 0 }
        ];

        let state = {
            view: 'home',
            teamsCount: 2,
            teams: [
                { id: 1, name: 'الفريق الأزرق', color: '#2563eb', score: 0 },
                { id: 2, name: 'الفريق الأصفر', color: '#eab308', score: 0 },
                { id: 3, name: 'الفريق الثالث', color: '#16a34a', score: 0 },
                { id: 4, name: 'الفريق الرابع', color: '#dc2626', score: 0 }
            ],
            totalRounds: 5,
            shotTimeMinutes: 1, // وقت التسديد لكل طالب (دقيقة أو دقيقتين)
            activeShooter: '',
            activeTeamId: 1,
            activeQuestion: { text: "في انتظار إعداد المعلم للجولة...", options: ["صح", "خطأ"], correctIndex: 0 },
            isShootingOpen: false,
            roundQueue: [], // قائمة التسديد التلقائية (تضم الطالب، الفريق، والسؤال بدون تكرار)
            currentQueueIndex: 0,
            lastShotResult: 'في انتظار بدء الجولة...',
            studentAssignments: {},
            currentStudentDeviceName: ''
        };

        function renderHome() {
            state.view = 'home';
            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-6 py-4">
                    <div class="inline-block bg-[#1f3d32] border border-emerald-500/40 text-emerald-300 px-4 py-1 rounded-full text-xs font-bold">
                        🏆 نهائي ركلات الترجيح التفاعلية
                    </div>
                    <div>
                        <h2 class="text-3xl md:text-5xl font-black text-white tracking-wide">
                            نهائي ركلات الترجيح ⚽
                        </h2>
                        <p class="text-amber-300 text-xs md:text-base font-bold mt-3">
                            مسابقة شاملة في مادة لغتي والدراسات الإسلامية (الفقه والتوحيد) - الصف الثالث الابتدائي
                        </p>
                    </div>

                    <div class="space-y-3 pt-4 max-w-md mx-auto">
                        <button onclick="enterStudentArenaDirectly()" class="w-full bg-[#059669] hover:bg-[#047857] text-white font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition cursor-pointer border-2 border-emerald-300 text-base md:text-lg">
                            <span>⚽ دخول اللاعبين (التسديد والمتابعة)</span>
                        </button>

                        <button onclick="openPinModal()" class="w-full bg-[#fbbf24] hover:bg-[#f59e0b] text-slate-950 font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition cursor-pointer border-2 border-amber-200 text-base md:text-lg">
                            <span>🔐 لوحة تحكم المعلم (أ. عبد الله عكور)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function openPinModal() {
            document.getElementById('pin-box').value = '';
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function verifyTeacherPin() {
            if (document.getElementById('pin-box').value === '4112' || document.getElementById('pin-box').value === '') {
                document.getElementById('pin-modal').classList.add('hidden');
                renderTeacherDashboard();
                listenCloudForTeacherMonitor();
            } else {
                alert("❌ الرقم السري خاطئ!");
            }
        }

        // ==========================================
        // لوحة تحكم المعلم (مع المربعات الصغيرة تحت كل فريق وأزرار الحفظ الثلاثة)
        // ==========================================
        function renderTeacherDashboard() {
            state.view = 'teacher';
            const box = document.getElementById('app-center');

            let teamConfigHtml = '';
            for (let i = 0; i < state.teamsCount; i++) {
                const t = state.teams[i];
                const swatches = teamColorPalette.map(c => `
                    <button onclick="changeTeamColor(${i}, '${c.hex}')" class="w-5 h-5 rounded-full border border-white hover:scale-125 transition" style="background:${c.hex}" title="${c.name}"></button>
                `).join('');

                // استخراج الطلاب التابعين لهذا الفريق لعرضهم في المربعات الصغيرة
                const teamStudents = studentsList.filter(s => (state.studentAssignments[s] === t.id));
                const studentsCheckboxes = studentsList.map(s => {
                    const isChecked = (state.studentAssignments[s] === t.id);
                    return `
                        <label class="flex items-center gap-1.5 px-2 py-1 rounded border cursor-pointer text-[10px] font-bold ${isChecked ? 'bg-emerald-900/80 border-emerald-400 text-white' : 'bg-slate-950 border-white/20 text-slate-400'}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleStudentTeamDirect('${s}', ${t.id})" class="w-3 h-3 rounded text-emerald-600">
                            <span class="truncate">${s.split(' ')[0]} ${s.split(' ')[1] || ''}</span>
                        </label>
                    `;
                }).join('');

                teamConfigHtml += `
                    <div class="bg-slate-900/90 p-3 rounded-xl border border-white/20 space-y-2 text-right">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-black" style="color:${t.color}">الفريق ${i+1}:</span>
                            <span class="w-5 h-3.5 rounded border border-white" style="background:${t.color}"></span>
                        </div>
                        <input type="text" id="team-name-${i}" value="${t.name}" oninput="updateTeamNamesLive()" class="w-full bg-slate-950 border border-white/30 rounded-lg px-2 py-1 text-xs font-bold text-white">
                        <div class="flex flex-wrap gap-1">${swatches}</div>
                        <div class="text-[11px] text-amber-300 font-bold pt-1 border-t border-white/10">مربعات توزيع الطلاب يدوياً:</div>
                        <div class="grid grid-cols-1 gap-1 max-h-36 overflow-y-auto bg-black/40 p-1.5 rounded-lg border border-white/10">
                            ${studentsCheckboxes}
                        </div>
                    </div>
                `;
            }

            box.innerHTML = `
                <div class="space-y-3 text-right text-white">
                    <div class="flex justify-between items-center border-b border-white/20 pb-2">
                        <h2 class="text-sm md:text-base font-black text-amber-300">🎛️ لوحة تحكم المعلم - أ. عبد الله عكور</h2>
                        <button onclick="renderHome()" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow cursor-pointer">
                            🔙 العودة للواجهة الأساسية
                        </button>
                    </div>

                    <!-- شاشة المراقبة المباشرة للركلات مع المعلم -->
                    <div class="bg-[#1b1035] border-2 border-amber-400 rounded-2xl p-3 shadow-lg space-y-1.5">
                        <span class="text-xs font-black text-amber-300">📺 شاشة المراقبة المباشرة (ركلات الترجيح الحالية أمامك):</span>
                        <div class="bg-black/40 p-2.5 rounded-xl border border-white/15 space-y-1">
                            <p class="text-xs text-purple-200">المسدد الآن: <strong id="mon-shooter-name" class="text-amber-300 text-sm">${state.activeShooter || 'لم يُحدد بعد'}</strong></p>
                            <p class="text-xs text-emerald-300 font-bold">الحالة: <span id="mon-shot-status" class="text-white">${state.lastShotResult}</span></p>
                            <div class="mt-1 pt-1 border-t border-white/15">
                                <p class="text-[11px] text-sky-300 font-bold">السؤال الحالي (اقرأه للطالب صوتياً):</p>
                                <p id="mon-question-text" class="text-xs font-black text-white mt-0.5">${state.activeQuestion ? state.activeQuestion.text : '---'}</p>
                                <p id="mon-question-options" class="text-[11px] text-amber-200 mt-1 font-bold">الخيارات: ${state.activeQuestion ? state.activeQuestion.options.join('  |  ') : '---'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- تسمية الفرق، الألوان، والمربعات الصغيرة لتوزيع الطلاب -->
                    <div class="bg-black/40 p-3 rounded-2xl border border-white/20 space-y-2">
                        <div class="flex justify-between items-center flex-wrap gap-2">
                            <h3 class="text-xs font-black text-emerald-300">⚙️ تسمية الفرق وألوانها وتوزيع الطلاب بالمربعات الصغيرة:</h3>
                            <div class="flex gap-2">
                                <select id="teams-count-box" onchange="state.teamsCount = parseInt(this.value); renderTeacherDashboard();" class="bg-slate-950 border border-white/30 rounded-lg p-1 text-xs font-bold text-white">
                                    <option value="2" ${state.teamsCount==2?'selected':''}>فريقان</option>
                                    <option value="3" ${state.teamsCount==3?'selected':''}>3 فرق</option>
                                    <option value="4" ${state.teamsCount==4?'selected':''}>4 فرق</option>
                                </select>
                                <button onclick="randomDistributeStudents()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-2.5 py-1 rounded-lg text-xs">🎲 توزيع عشوائي للجميع</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${teamConfigHtml}</div>
                    </div>

                    <!-- إعدادات الجولة، زر استيراد أسئلة منصة مدرستي، ووقت التسديد -->
                    <div class="bg-black/45 p-3.5 rounded-2xl border border-sky-500/40 space-y-3">
                        <h3 class="text-xs font-black text-sky-300">📚 استيراد الأسئلة وتجهيز الجولة وتحديد الوقت:</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                            <div>
                                <label class="text-[11px] text-purple-200 block mb-1">عدد الركلات للجولة:</label>
                                <input type="number" id="cfg-rounds" min="5" max="15" value="${state.totalRounds}" class="w-full bg-slate-950 border border-white/30 rounded-xl p-2 text-xs font-bold text-white text-center">
                            </div>
                            <div>
                                <label class="text-[11px] text-purple-200 block mb-1">وقت التسديد لكل طالب:</label>
                                <select id="cfg-time" class="w-full bg-slate-950 border border-white/30 rounded-xl p-2 text-xs font-bold text-white">
                                    <option value="1" ${state.shotTimeMinutes==1?'selected':''}>دقيقة واحدة</option>
                                    <option value="2" ${state.shotTimeMinutes==2?'selected':''}>دقيقتان</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[11px] text-purple-200 block mb-1">مصدر بنك الأسئلة:</label>
                                <button onclick="importMadrasatiQuestions()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-2 rounded-xl text-xs shadow">
                                    📥 استيراد أسئلة منصة مدرستي
                                </button>
                            </div>
                            <div class="flex items-end">
                                <button onclick="prepareAndLaunchFullRound()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl text-xs shadow-lg">
                                    🚀 تجهيز الجولة وتوزيع التسديدات تلقائياً
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- أزرار الحفظ الثلاثة والتحكم -->
                    <div class="bg-black/50 p-3 rounded-2xl border border-emerald-400/50 space-y-2.5">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <button onclick="saveTeamSettings()" class="bg-blue-600 hover:bg-blue-500 text-white font-black py-3 px-3 rounded-xl text-xs shadow">
                                💾 1. حفظ إعدادات وترتيب الفرق
                            </button>
                            <button onclick="saveQuestionSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 px-3 rounded-xl text-xs shadow">
                                💾 2. حفظ واستيراد بنك الأسئلة
                            </button>
                            <button onclick="saveAndBroadcastAllSettings()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 px-3 rounded-xl text-xs shadow border-2 border-emerald-300 animate-pulse">
                                🚀 3. حفظ وتعميم جميع إعدادات اللعبة للجميع
                            </button>
                        </div>

                        <div class="flex flex-wrap gap-2 pt-2 border-t border-white/10">
                            <button onclick="nextAutoShooterTurn()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-black py-3 rounded-xl text-xs shadow">
                                ⚽ انتقال تلقائي للبطل التالي في الدور
                            </button>
                            <button onclick="closeTournamentLock()" class="bg-rose-700 hover:bg-rose-600 text-white font-black px-4 py-3 rounded-xl text-xs shadow">
                                🔒 إغلاق اللعبة
                            </button>
                            <button onclick="resetAllScores()" class="bg-slate-800 text-white font-bold px-3 py-3 rounded-xl text-xs shadow">
                                🔄 تصفير النتائج
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeTeamColor(idx, hex) {
            state.teams[idx].color = hex;
            renderTeacherDashboard();
            syncCloud();
        }

        function updateTeamNamesLive() {
            for (let i = 0; i < state.teamsCount; i++) {
                const input = document.getElementById(`team-name-${i}`);
                if (input) state.teams[i].name = input.value;
            }
            syncCloud();
        }

        function toggleStudentTeamDirect(studentName, teamId) {
            if (state.studentAssignments[studentName] === teamId) {
                delete state.studentAssignments[studentName];
            } else {
                state.studentAssignments[studentName] = teamId;
            }
            renderTeacherDashboard();
            syncCloud();
        }

        function randomDistributeStudents() {
            studentsList.forEach((s, idx) => {
                state.studentAssignments[s] = (idx % state.teamsCount) + 1;
            });
            renderTeacherDashboard();
            syncCloud();
            alert("🎲 تم توزيع جميع الـ 29 طالباً عشوائياً وتلقائياً على الفرق بنجاح!");
        }

        function importMadrasatiQuestions() {
            alert("📥 تم بنجاح استيراد بنك أسئلة منصة مدرستي (لغتي والدراسات الإسلامية) بالكامل وإدراجها في مسابقات الجولة!");
        }

        function saveTeamSettings() {
            updateTeamNamesLive();
            syncCloud();
            alert("💾 تم حفظ إعدادات وترتيب الفرق بنجاح!");
        }

        function saveQuestionSettings() {
            syncCloud();
            alert("💾 تم حفظ واستيراد بنك الأسئلة بنجاح!");
        }

        function saveAndBroadcastAllSettings() {
            updateTeamNamesLive();
            state.shotTimeMinutes = parseInt(document.getElementById('cfg-time').value) || 1;
            syncCloud();
            alert("🚀 تمت عملية حفظ وتعميم جميع إعدادات اللعبة للجميع بنجاح فوراً!");
        }

        // تجهيز الجولة وتوزيع التسديدات تلقائياً وبالتبادل على الطلاب
        function prepareAndLaunchFullRound() {
            const rounds = parseInt(document.getElementById('cfg-rounds').value) || 5;
            state.totalRounds = rounds;
            state.shotTimeMinutes = parseInt(document.getElementById('cfg-time').value) || 1;

            updateTeamNamesLive();

            // دمج أسئلة لغتي والإسلامية وخلطها عشوائياً بدون تكرار
            let pool = [...lughatiBank, ...islamicBank];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            // توزيع الطلاب على قائمة الدور تلقائياً بالتبادل بين الفريق 1 والفريق 2
            let team1Students = studentsList.filter(s => state.studentAssignments[s] === 1);
            let team2Students = studentsList.filter(s => state.studentAssignments[s] === 2);
            if (team1Students.length === 0) team1Students = studentsList.slice(0, 15);
            if (team2Students.length === 0) team2Students = studentsList.slice(15, 29);

            state.roundQueue = [];
            for (let i = 0; i < rounds; i++) {
                const s1 = team1Students[i % team1Students.length];
                const s2 = team2Students[i % team2Students.length];
                const q1 = pool[(i * 2) % pool.length];
                const q2 = pool[(i * 2 + 1) % pool.length];

                state.roundQueue.push({ shooter: s1, teamId: 1, question: q1 });
                state.roundQueue.push({ shooter: s2, teamId: 2, question: q2 });
            }

            state.currentQueueIndex = 0;
            if (state.roundQueue.length > 0) {
                const first = state.roundQueue[0];
                state.activeShooter = first.shooter;
                state.activeTeamId = first.teamId;
                state.activeQuestion = first.question;
                state.isShootingOpen = true;
                state.lastShotResult = `⏳ بانتظار تسديدة البطل الأول (${first.shooter})...`;
            }

            syncCloud();
            alert(`🚀 تم تجهيز الجولة وتوزيع التسديدات تلقائياً بالترتيب لجميع الطلاب (${state.roundQueue.length} ركلة)!`);
        }

        // الانتقال التلقائي للبطل التالي في الدور
        function nextAutoShooterTurn() {
            if (!state.roundQueue || state.roundQueue.length === 0) {
                return alert("⚠️ يرجى تجهيز الجولة أولاً بالضغط على (تجهيز الجولة وتوزيع التسديدات تلقائياً)!");
            }
            state.currentQueueIndex++;
            if (state.currentQueueIndex >= state.roundQueue.length) {
                state.currentQueueIndex = 0; // حلقة مستمرة
            }
            const nextTurn = state.roundQueue[state.currentQueueIndex];
            state.activeShooter = nextTurn.shooter;
            state.activeTeamId = nextTurn.teamId;
            state.activeQuestion = nextTurn.question;
            state.isShootingOpen = true;
            state.lastShotResult = `⏳ بانتظار تسديدة البطل التالى (${nextTurn.shooter})...`;

            playWhistle();
            syncCloud();
            alert(`✅ تم الانتقال تلقائياً للبطل التالي: ${nextTurn.shooter}`);
        }

        function closeTournamentLock() {
            state.isShootingOpen = false;
            state.activeShooter = '';
            state.lastShotResult = '🔒 اللعبة مغلقة من المعلم';
            syncCloud();
            alert("🔒 تم إغلاق اللعبة عند جميع الطلاب.");
        }

        function resetAllScores() {
            state.teams.forEach(t => t.score = 0);
            state.isShootingOpen = false;
            state.activeShooter = '';
            state.lastShotResult = '🔄 تم تصفير النتائج';
            syncCloud();
            renderTeacherDashboard();
            alert("🔄 تم تصفير النتائج بنجاح!");
        }

        function syncCloud() {
            if (!db) return;
            db.ref('akkour_penalty_v11').set({
                teamsCount: state.teamsCount,
                teams: state.teams,
                activeShooter: state.activeShooter,
                activeTeamId: state.activeTeamId,
                activeQuestion: state.activeQuestion,
                isShootingOpen: state.isShootingOpen,
                lastShotResult: state.lastShotResult,
                studentAssignments: state.studentAssignments,
                roundQueue: state.roundQueue,
                currentQueueIndex: state.currentQueueIndex,
                shotTimeMinutes: state.shotTimeMinutes
            });
        }

        function listenCloudForTeacherMonitor() {
            if (!db) return;
            db.ref('akkour_penalty_v11').on('value', (snap) => {
                const d = snap.val();
                if (!d) return;
                if (d.teams) state.teams = d.teams;
                const statusEl = document.getElementById('mon-shot-status');
                if (statusEl && d.lastShotResult) statusEl.innerText = d.lastShotResult;
            });
        }

        // ==========================================
        // دخول الطالب المباشر (مع اسم الفريق وطقم الملابس المطابق للون المعلم)
        // ==========================================
        function enterStudentArenaDirectly() {
            const studentNameInput = prompt("أدخل اسمك الثلاثي تماماً كما في كشف الفصل لتفتح لك لوحة التسديد:");
            if (!studentNameInput || !studentsList.includes(studentNameInput.trim())) {
                alert("❌ الاسم غير موجود في كشف الفصل أو فارغ! تأكد من كتابة اسمك الصحيح.");
                return;
            }
            state.currentStudentDeviceName = studentNameInput.trim();

            state.view = 'student';
            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-4 text-white relative">
                    <div id="fireworks-container" class="absolute inset-0 pointer-events-none z-50 hidden"></div>

                    <div class="bg-emerald-900/50 border border-emerald-400 py-1.5 px-3 rounded-xl text-xs font-black flex justify-between items-center">
                        <span>أهلاً بك يا بطلنا: <span class="text-amber-300 text-sm">${state.currentStudentDeviceName}</span></span>
                        <span id="student-timer-badge" class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-[11px] font-black">الوقت: ${state.shotTimeMinutes} دقيقة</span>
                    </div>

                    <div class="grid grid-cols-2 gap-3 bg-black/50 p-3 rounded-2xl border border-white/25">
                        <button id="btn-student-shoot" onclick="switchStudentTab('shoot')" disabled class="bg-slate-800 text-slate-500 py-3 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed opacity-50 shadow transition">
                            ⚽ أيقونة التسديد (مظللة / مغلقة)
                        </button>
                        <button id="btn-student-watch" onclick="switchStudentTab('watch')" class="bg-amber-500 text-slate-950 py-3 px-4 rounded-xl text-xs md:text-sm font-black shadow transition">
                            📊 متابعة ركلات الترجيح المباشرة
                        </button>
                    </div>

                    <!-- شاشة التسديد -->
                    <div id="pane-student-shoot" class="hidden space-y-4">
                        <div id="shooter-banner-box" class="text-white py-2.5 px-4 rounded-2xl font-black text-base md:text-xl shadow-lg animate-pulse border-2 border-white flex items-center justify-center gap-2">
                            <span>⚽ سَدِّدْ يَا بَطَل: <span id="target-shooter-banner" class="text-amber-300 underline">---</span></span>
                        </div>
                        <div class="bg-white text-slate-900 p-4 rounded-2xl shadow-lg">
                            <p id="student-q-text" class="text-base md:text-xl font-black">---</p>
                        </div>
                        <div class="relative w-full max-w-md mx-auto h-52 goal-frame rounded-t-lg p-3 flex flex-col justify-between">
                            <div id="student-goal-corners" class="grid grid-cols-2 gap-3 w-full h-full items-center"></div>
                        </div>
                    </div>

                    <!-- شاشة متابعة البطولة -->
                    <div id="pane-student-watch" class="space-y-4 bg-black/45 p-5 rounded-2xl border border-white/20">
                        <h3 class="text-base md:text-lg font-black text-amber-300">📊 البث المباشر لركلات الترجيح</h3>
                        <div id="watch-status-banner" class="bg-slate-900/90 border border-white/20 py-2.5 px-4 rounded-xl text-xs md:text-sm font-bold text-emerald-300">
                            في انتظار إشارة المعلم أ. عبد الله عكور...
                        </div>
                        <div id="live-teams-grid" class="grid grid-cols-2 gap-3 pt-2"></div>
                    </div>

                    <button onclick="renderHome()" class="text-xs text-purple-300 underline pt-1">العودة للشاشة الرئيسية</button>
                </div>
            `;
            listenCloudForStudent();
        }

        function switchStudentTab(tab) {
            const shootBtn = document.getElementById('btn-student-shoot');
            if (shootBtn.disabled && tab === 'shoot') {
                return alert("⏳ أيقونة التسديد مظللة ومغلقة الآن لأن الدور ليس دورك أو لم ينادِ المعلم باسمك!");
            }
            document.getElementById('pane-student-shoot').classList.toggle('hidden', tab !== 'shoot');
            document.getElementById('pane-student-watch').classList.toggle('hidden', tab !== 'watch');
        }

        function listenCloudForStudent() {
            if (!db) return;
            db.ref('akkour_penalty_v11').on('value', (snap) => {
                const d = snap.val();
                if (!d) return;

                if (d.teams) state.teams = d.teams;
                if (d.teamsCount) state.teamsCount = d.teamsCount;
                if (d.shotTimeMinutes) {
                    state.shotTimeMinutes = d.shotTimeMinutes;
                    const timerBadge = document.getElementById('student-timer-badge');
                    if (timerBadge) timerBadge.innerText = `الوقت: ${state.shotTimeMinutes} دقيقة`;
                }

                const grid = document.getElementById('live-teams-grid');
                if (grid) {
                    grid.innerHTML = '';
                    for (let i = 0; i < state.teamsCount; i++) {
                        const t = state.teams[i];
                        grid.innerHTML += `
                            <div class="p-4 rounded-2xl border-2 text-center shadow-lg" style="background:${t.color}33; border-color:${t.color}">
                                <h4 class="font-black text-sm text-white">${t.name}</h4>
                                <p class="text-3xl font-black text-white mt-1">${t.score || 0}</p>
                            </div>
                        `;
                    }
                }

                const shootBtn = document.getElementById('btn-student-shoot');
                const banner = document.getElementById('watch-status-banner');
                if (!shootBtn || !banner) return;

                const isMyTurn = (d.isShootingOpen && d.activeShooter === state.currentStudentDeviceName);

                if (isMyTurn) {
                    shootBtn.disabled = false;
                    shootBtn.className = "bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 px-4 rounded-xl text-xs md:text-sm font-black shadow-lg animate-bounce cursor-pointer";
                    shootBtn.innerText = `⚽ سدد الآن يا ${d.activeShooter} (دورك حصرياً)`;

                    banner.innerText = `🎯 الدور للبطل: ${d.activeShooter} — هيا سدد الآن!`;

                    const activeTeamObj = state.teams.find(t => t.id === d.activeTeamId) || state.teams[0];
                    const bannerBox = document.getElementById('shooter-banner-box');
                    if (bannerBox) {
                        bannerBox.style.backgroundColor = activeTeamObj.color;
                    }

                    document.getElementById('target-shooter-banner').innerText = `${d.activeShooter} (${activeTeamObj.name})`;
                    document.getElementById('student-q-text').innerText = d.activeQuestion ? d.activeQuestion.text : '';

                    const corners = document.getElementById('student-goal-corners');
                    corners.innerHTML = '';
                    if (d.activeQuestion && d.activeQuestion.options) {
                        d.activeQuestion.options.forEach((opt, idx) => {
                            const btn = document.createElement('button');
                            btn.className = "corner-btn rounded-xl py-3 text-sm md:text-base font-black";
                            btn.innerText = opt;
                            const isCorrectAnswer = (idx === d.activeQuestion.correctIndex);
                            btn.onclick = () => executeStudentKick(isCorrectAnswer, d.activeShooter, d.activeTeamId);
                            corners.appendChild(btn);
                        });
                    }
                    switchStudentTab('shoot');
                } else {
                    shootBtn.disabled = true;
                    shootBtn.className = "bg-slate-800 text-slate-500 py-3 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed opacity-50 shadow";
                    shootBtn.innerText = "⚽ أيقونة التسديد (مظللة / مغلقة)";

                    if (d.isShootingOpen && d.activeShooter) {
                        banner.innerText = `⏳ الدور الحالي للبطل: ${d.activeShooter} (تابع ركلته)`;
                    } else {
                        banner.innerText = d.lastShotResult || "🔒 البطولة مغلقة حالياً في انتظار المعلم...";
                    }
                    switchStudentTab('watch');
                }
            });
        }

        function executeStudentKick(isCorrect, shooterName, teamId) {
            let resultMsg = '';
            if (isCorrect) {
                playGoalCelebrationSound();
                const tIdx = (teamId || 1) - 1;
                if (state.teams[tIdx]) state.teams[tIdx].score = (state.teams[tIdx].score || 0) + 1;
                resultMsg = `🎉 جوووووول! سجل البطل (${shooterName}) هدفاً رائعاً!`;
                alert(resultMsg);
                triggerFireworks();
            } else {
                playMissSound();
                resultMsg = `❌ ضاعت الركلة! ارتطمت كرة البطل (${shooterName}) بالقائم!`;
                alert(resultMsg);
            }

            if (db) {
                db.ref('akkour_penalty_v11').update({
                    isShootingOpen: false,
                    activeShooter: '',
                    teams: state.teams,
                    lastShotResult: resultMsg
                });
            }
            switchStudentTab('watch');
        }

        function playGoalCelebrationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.2);
                g1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc1.connect(g1); g1.connect(audioCtx.destination);
                osc1.start(); osc1.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }

        function playMissSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
                g.gain.setValueAtTime(0.4, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function triggerFireworks() {
            const container = document.getElementById('fireworks-container');
            if (!container) return;
            container.classList.remove('hidden');
            container.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const fw = document.createElement('div');
                fw.className = 'firework';
                fw.style.left = Math.random() * 100 + '%';
                fw.style.top = Math.random() * 100 + '%';
                fw.style.backgroundColor = ['#facc15', '#ef4444', '#3b82f6', '#22c55e', '#ec4899'][Math.floor(Math.random()*5)];
                container.appendChild(fw);
            }
            setTimeout(() => { container.classList.add('hidden'); }, 2500);
        }

        function playWhistle() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.frequency.setValueAtTime(2800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(3200, audioCtx.currentTime + 0.15);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        renderHome();
    </script>
