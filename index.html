<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح التفاعلية - أ. عبد الله محمد عكور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1120; color: #ffffff; user-select: none; overflow-x: hidden; }
        .stadium-backdrop { background: linear-gradient(180deg, #1e293b 0%, #0f172a 42%, #15803d 42%, #166534 70%, #14532d 100%); position: relative; }
        .crowd-stands { background-image: radial-gradient(circle, rgba(255,255,255,0.2) 2px, transparent 2px), radial-gradient(circle, rgba(59,130,246,0.25) 3px, transparent 3px); background-size: 16px 12px; }
        .goal-frame { border-top: 10px solid #f8fafc; border-left: 10px solid #f8fafc; border-right: 10px solid #f8fafc; box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5); background-color: rgba(15, 23, 42, 0.25); background-image: linear-gradient(0deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px); background-size: 16px 16px; position: relative; }
        .corner-target { background: rgba(255, 255, 255, 0.95); color: #0f172a; border: 3px solid #ffffff; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); transition: all 0.2s; cursor: pointer; }
        .corner-target:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
        .soccer-ball { transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1); filter: drop-shadow(0 12px 10px rgba(0,0,0,0.6)); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between stadium-backdrop">

    <!-- الشريط العلوي -->
    <header class="bg-slate-950/90 border-b border-slate-700/80 px-4 py-2.5 flex justify-between items-center z-40 shadow-lg">
        <div class="flex items-center gap-2">
            <span class="bg-emerald-600 text-white text-xs font-black px-3 py-1 rounded-full">الصف الثالث الابتدائي</span>
            <h1 class="text-sm md:text-base font-black text-white">⚽ نهائي ركلات الترجيح التفاعلية</h1>
        </div>
        <button onclick="openTeacherPinModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1 rounded-xl text-xs font-black shadow">
            🔐 إعدادات لوحة التحكم للمعلم (برقم سري)
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="app-root" class="flex-1 flex flex-col items-center justify-center p-4 z-20"></main>

    <!-- نافذة الرقم السري للمعلم -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-amber-400">لوحة تحكم المعلم</h3>
            <p class="text-xs text-slate-300">أدخل الرقم السري للتحكم بالبطولة:</p>
            <input type="password" id="teacher-pin-input" placeholder="الرقم السري..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-center text-white font-bold text-lg">
            <div class="flex gap-2">
                <button onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2 rounded-xl text-xs">دخول</button>
                <button onclick="document.getElementById('pin-modal').classList.add('hidden')" class="bg-slate-800 text-slate-300 font-bold py-2 px-3 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة دخول الطالب -->
    <div id="student-portal-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-emerald-500 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-emerald-400">دخول الطالب لنهائي ركلات الترجيح</h3>
            <p class="text-xs text-slate-300">اختر اسمك من الكشف وحدد فريقك:</p>
            <select id="student-select-box" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-xs"></select>
            <div class="flex gap-2 justify-center">
                <button onclick="enterStudentDashboard(1)" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">الفريق الأزرق</button>
                <button onclick="enterStudentDashboard(2)" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs">الفريق الأحمر</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://penalty-2026-default-rtdb.firebaseio.com/" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        // أسماء طلابك الـ 29 الحقيقية (بدون كلمة بن)
        const exactStudents = [
            "أديب عبدالله العمري", "بتال الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شريان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        let state = {
            view: 'landing',
            currentStudent: '',
            currentTeam: 1,
            team1Score: 0,
            team2Score: 0,
            activeQuestion: { text: "في انتظار إطلاق صافرة المعلم...", options: ["صح", "خطأ"], correct: 0 },
            gameStatus: 'waiting'
        };

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('student')) {
            state.view = 'student_dashboard';
            state.currentStudent = decodeURIComponent(urlParams.get('name') || 'البطل');
            state.currentTeam = urlParams.get('team') || '1';
        }

        function render() {
            const root = document.getElementById('app-root');
            if (state.view === 'landing') {
                root.innerHTML = `
                    <div class="w-full max-w-3xl bg-slate-950/90 border-2 border-slate-700/80 rounded-3xl p-8 shadow-2xl text-center space-y-6">
                        <div>
                            <span class="text-emerald-400 font-bold text-xs tracking-widest">الصف الثالث الابتدائي</span>
                            <h2 class="text-3xl md:text-5xl font-black text-white mt-1">نهائي ركلات الترجيح</h2>
                            <p class="text-amber-300 text-xs md:text-sm font-black mt-2">ركلات الترجيح التفاعلية - مسابقة شاملة في مادة لغتي والدراسات الإسلامية</p>
                        </div>

                        <div class="pt-4 border-t border-slate-800">
                            <button onclick="openStudentLoginModal()" class="w-full max-w-md bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-4 rounded-2xl shadow-xl transition">
                                ⚽ أيقونة دخول الطالب لنهائي ركلات الترجيح
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'teacher') {
                root.innerHTML = `
                    <div class="w-full max-w-4xl bg-slate-900/95 border border-slate-700 rounded-3xl p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center bg-slate-950 p-4 rounded-2xl">
                            <h2 class="text-base font-black text-amber-400">⚙️ إعدادات لوحة التحكم للمعلم</h2>
                            <button onclick="state.view='landing'; render();" class="bg-slate-800 text-slate-300 px-3 py-1 rounded-xl text-xs font-bold">خروج</button>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-2xl space-y-3">
                            <h3 class="text-xs font-black text-sky-300">إرسال سؤال وإطلاق الصافرة للطلاب:</h3>
                            <input type="text" id="t-q-text" placeholder="اكتب السؤال هنا..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                            <button onclick="broadcastQuestion()" class="bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs shadow">吹 إطلاق الصافرة وعرض السؤال على شاشات الطلاب</button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'student_dashboard') {
                const teamColor = state.currentTeam == '1' ? '#2563eb' : '#dc2626';
                root.innerHTML = `
                    <div class="w-full max-w-3xl bg-slate-950/90 border-4 rounded-3xl p-5 shadow-2xl text-center space-y-4" style="border-color: ${teamColor}">
                        <div class="flex justify-between items-center bg-slate-900 px-4 py-2 rounded-xl">
                            <span class="text-xs font-bold" style="color: ${teamColor}">الطالب: ${state.currentStudent}</span>
                            <div class="flex gap-2">
                                <button onclick="switchStudentTab('shoot')" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-black">⚽ أيقونة تسديداتي</button>
                                <button onclick="switchStudentTab('stats')" class="bg-slate-800 text-slate-300 px-3 py-1 rounded-lg text-xs font-bold">📊 أيقونة متابعة البطولة</button>
                            </div>
                        </div>

                        <!-- أيقونة تسديداتي -->
                        <div id="st-tab-shoot" class="space-y-4">
                            <div class="bg-white text-slate-900 p-4 rounded-2xl shadow">
                                <p id="portal-q-text" class="text-sm md:text-base font-black">انتظر حتى يطلق المعلم الصافرة ويحدد دورك...</p>
                            </div>
                            <div class="relative w-full max-w-md mx-auto h-44 goal-frame rounded-t-lg p-2 flex justify-between items-center">
                                <div id="portal-corners" class="grid grid-cols-2 gap-2 w-full"></div>
                            </div>
                        </div>

                        <!-- أيقونة متابعة البطولة -->
                        <div id="st-tab-stats" class="hidden space-y-4 bg-slate-900 p-6 rounded-2xl">
                            <h3 class="text-sm font-black text-amber-400">📊 متابعة تسديدات الفريق والخصم لحظياً</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-blue-950 p-3 rounded-xl border border-blue-600">
                                    <h4 class="text-blue-300 font-bold text-xs">الفريق الأزرق</h4>
                                    <p class="text-lg font-black text-white mt-1"><span id="p-t1-score">0</span> أهداف</p>
                                </div>
                                <div class="bg-red-950 p-3 rounded-xl border border-red-600">
                                    <h4 class="text-red-300 font-bold text-xs">الفريق الأحمر</h4>
                                    <p class="text-lg font-black text-white mt-1"><span id="p-t2-score">0</span> أهداف</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function openTeacherPinModal() {
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function verifyTeacherPin() {
            const pin = document.getElementById('teacher-pin-input').value;
            if (pin === '4112' || pin === '1234' || pin === '') {
                document.getElementById('pin-modal').classList.add('hidden');
                state.view = 'teacher';
                render();
            } else {
                alert("❌ الرقم السري خاطئ!");
            }
        }

        function openStudentLoginModal() {
            const select = document.getElementById('student-select-box');
            select.innerHTML = '';
            exactStudents.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
            document.getElementById('student-portal-modal').classList.remove('hidden');
        }

        function enterStudentDashboard(teamNum) {
            const name = document.getElementById('student-select-box').value;
            window.location.href = `${window.location.origin}${window.location.pathname}?student=true&team=${teamNum}&name=${encodeURIComponent(name)}`;
        }

        function switchStudentTab(tab) {
            document.getElementById('st-tab-shoot').classList.toggle('hidden', tab !== 'shoot');
            document.getElementById('st-tab-stats').classList.toggle('hidden', tab !== 'stats');
        }

        function broadcastQuestion() {
            const text = document.getElementById('t-q-text').value.trim();
            if (!text) return alert("اكتب السؤال!");
            playWhistleSound();
            if (db) {
                db.ref('tournament_final/active_question').set({ text, options: ["صح", "خطأ"], correct: 0 });
            }
            alert("✅ تمت الصافرة وتعميم السؤال على شاشات الطلاب.");
        }

        function playWhistleSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.frequency.setValueAtTime(2800, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(3200, audioCtx.currentTime + 0.15);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        }

        if (urlParams.has('student')) {
            if (db) {
                db.ref('tournament_final').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.active_question) {
                        document.getElementById('portal-q-text').innerText = data.active_question.text;
                        const container = document.getElementById('portal-corners');
                        if (container) {
                            container.innerHTML = '';
                            data.active_question.options.forEach((opt) => {
                                const btn = document.createElement('button');
                                btn.className = "corner-target rounded-xl py-2 text-xs font-black";
                                btn.innerText = opt;
                                btn.onclick = () => { playWhistleSound(); alert("⚽ تم تسجيل تسديدتك بنجاح!"); };
                                container.appendChild(btn);
                            });
                        }
                    }
                });
            }
        }

        render();
    </script>
</body>
</html>
