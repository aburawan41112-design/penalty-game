<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح - أ. عبد الله عكور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #064e3b; color: #ffffff; user-select: none; overflow-x: hidden; }
        .stadium-bg { background: linear-gradient(180deg, #065f46 0%, #047857 40%, #15803d 70%, #166534 100%); position: relative; }
        .pitch-lines { background-image: linear-gradient(0deg, rgba(255,255,255,0.12) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.12) 2px, transparent 2px); background-size: 45px 45px; }
        .goal-frame { border-top: 10px solid #f8fafc; border-left: 10px solid #f8fafc; border-right: 10px solid #f8fafc; box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5); background-color: rgba(6, 78, 59, 0.4); background-image: linear-gradient(0deg, rgba(255,255,255,0.3) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.3) 1.5px, transparent 1.5px); background-size: 16px 16px; position: relative; }
        .corner-btn { background: rgba(255, 255, 255, 0.95); color: #064e3b; border: 3px solid #ffffff; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.2s; cursor: pointer; }
        .corner-btn:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between stadium-bg pitch-lines">

    <!-- شريط علوي نظيف بدون تكرار -->
    <header class="bg-slate-900/90 border-b border-emerald-600/30 px-6 py-3 flex justify-between items-center z-40 shadow-md">
        <span class="text-xs font-bold text-emerald-300">أ. عبد الله عكور</span>
        <span class="text-xs font-bold text-slate-300">نهائي ركلات الترجيح التفاعلية</span>
    </header>

    <!-- المحتوى المركزي -->
    <main id="app-root" class="flex-1 flex flex-col items-center justify-center p-4 z-20"></main>

    <!-- نافذة رقم المعلم السري -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-amber-400">لوحة تحكم المعلم</h3>
            <p class="text-xs text-slate-300">أدخل الرقم السري للتحكم:</p>
            <input type="password" id="pin-box" placeholder="الرقم السري..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-center text-white font-bold text-lg">
            <div class="flex gap-2">
                <button onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2 rounded-xl text-xs">دخول</button>
                <button onclick="document.getElementById('pin-modal').classList.add('hidden')" class="bg-slate-800 text-slate-300 font-bold py-2 px-3 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة اختيار الطالب من قِبل المعلم وتوجيهه -->
    <div id="student-select-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-emerald-500 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-emerald-400">أيقونة دخول الطالب لنهائي ركلات الترجيح</h3>
            <p class="text-xs text-slate-300">اختر اسم الطالب من الكشف (توفیراً لوقت الأطفال):</p>
            <select id="student-dropdown" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-xs"></select>
            <div class="flex gap-2 justify-center">
                <button onclick="startStudentSession(1)" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">فريق أزرق</button>
                <button onclick="startStudentSession(2)" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs">فريق أحمر</button>
            </div>
            <button onclick="document.getElementById('student-select-modal').classList.add('hidden')" class="text-xs text-slate-400 underline">إلغاء</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://penalty-2026-default-rtdb.firebaseio.com/" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        const studentsList = [
            "أديب عبدالله العمري", "بتال الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شريان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        let state = { view: 'home', studentName: '', teamName: '', teamColor: '#2563eb' };

        function render() {
            const root = document.getElementById('app-root');
            if (state.view === 'home') {
                root.innerHTML = `
                    <div class="w-full max-w-2xl bg-slate-950/9 border border-emerald-500/30 rounded-3xl p-8 shadow-2xl text-center space-y-6 backdrop-blur-md">
                        <div>
                            <h2 class="text-3xl md:text-4xl font-black text-white flex items-center justify-center gap-3">
                                نهائي ركلات الترجيح ⚽
                            </h2>
                            <p class="text-amber-300 text-xs md:text-sm font-bold mt-2">
                                ركلات الترجيح التفاعلية - مسابقة شاملة في مادة لغتي والدراسات الإسلامية
                            </p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-800">
                            <!-- الأيقونة الأولى: دخول الطالب -->
                            <button onclick="openStudentModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black p-5 rounded-2xl shadow-xl flex flex-col items-center justify-center gap-2 transition">
                                <span class="text-2xl">⚽</span>
                                <span class="text-sm">أيقونة دخول الطالب<br><span class="text-xs font-normal text-emerald-100">لنهائي ركلات الترجيح</span></span>
                            </button>

                            <!-- الأيقونة الثانية: لوحة تحكم المعلم عبد الله عكور -->
                            <button onclick="openPinModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-5 rounded-2xl shadow-xl flex flex-col items-center justify-center gap-2 transition">
                                <span class="text-2xl">🔐</span>
                                <span class="text-sm">لوحة تحكم المعلم<br><span class="text-xs font-bold text-slate-900">أ. عبد الله عكور</span></span>
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'teacher') {
                root.innerHTML = `
                    <div class="w-full max-w-4xl bg-slate-900/95 border border-slate-700 rounded-3xl p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center bg-slate-950 p-4 rounded-2xl">
                            <h2 class="text-sm font-black text-amber-400">لوحة تحكم المعلم - أ. عبد الله عكور</h2>
                            <button onclick="state.view='home'; render();" class="bg-slate-800 text-slate-300 px-3 py-1 rounded-xl text-xs font-bold">خروج</button>
                        </div>
                        <div class="bg-slate-950 p-4 rounded-2xl space-y-3">
                            <h3 class="text-xs font-black text-sky-300">إرسال سؤال وتفعيل الصافرة للطلاب:</h3>
                            <input type="text" id="t-q" placeholder="اكتب السؤال هنا..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white">
                            <button onclick="broadcast()" class="bg-amber-500 text-slate-950 font-black py-2 px-4 rounded-xl text-xs shadow">吹 إطلاق الصافرة وتعميم السؤال</button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'student_portal') {
                root.innerHTML = `
                    <div class="w-full max-w-3xl bg-slate-950/90 border-4 rounded-3xl p-5 shadow-2xl text-center space-y-4" style="border-color: ${state.teamColor}">
                        <div class="flex justify-between items-center bg-slate-900 px-4 py-2 rounded-xl">
                            <span class="text-xs font-bold text-white">الطالب: ${state.studentName} (${state.teamName})</span>
                            <div class="flex gap-2">
                                <button onclick="tab('shoot')" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-black">⚽ أيقونة تسديداتي</button>
                                <button onclick="tab('stats')" class="bg-slate-800 text-slate-300 px-3 py-1 rounded-lg text-xs font-bold">📊 أيقونة متابعة البطولة</button>
                            </div>
                        </div>

                        <div id="tab-shoot" class="space-y-4">
                            <div class="bg-white text-slate-900 p-4 rounded-2xl shadow">
                                <p id="q-text" class="text-sm md:text-base font-black">انتظر إطلاق المعلم للصافرة وتحديد دورك...</p>
                            </div>
                            <div class="relative w-full max-w-md mx-auto h-44 goal-frame rounded-t-lg p-2 flex justify-between items-center">
                                <div id="corners-box" class="grid grid-cols-2 gap-2 w-full"></div>
                            </div>
                        </div>

                        <div id="tab-stats" class="hidden space-y-4 bg-slate-900 p-6 rounded-2xl">
                            <h3 class="text-sm font-black text-amber-400">📊 متابعة تسديدات الفريق والخصم لحظياً</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-blue-950 p-3 rounded-xl border border-blue-600"><h4 class="text-blue-300 font-bold text-xs">الفريق الأزرق</h4><p class="text-lg font-black text-white mt-1">0 أهداف</p></div>
                                <div class="bg-red-950 p-3 rounded-xl border border-red-600"><h4 class="text-red-300 font-bold text-xs">الفريق الأحمر</h4><p class="text-lg font-black text-white mt-1">0 أهداف</p></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); }
        function verifyTeacherPin() {
            if (document.getElementById('pin-box').value === '4112' || document.getElementById('pin-box').value === '') {
                document.getElementById('pin-modal').classList.add('hidden');
                state.view = 'teacher'; render();
            } else { alert("❌ الرقم السري خاطئ!"); }
        }

        function openStudentModal() {
            const sel = document.getElementById('student-dropdown');
            sel.innerHTML = '';
            studentsList.forEach(n => { const o = document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o); });
            document.getElementById('student-select-modal').classList.remove('hidden');
        }

        function startStudentSession(team) {
            state.studentName = document.getElementById('student-dropdown').value;
            state.teamName = team === 1 ? 'الفريق الأزرق' : 'الفريق الأحمر';
            state.teamColor = team === 1 ? '#2563eb' : '#dc2626';
            state.view = 'student_portal';
            document.getElementById('student-select-modal').classList.add('hidden');
            render(); listenDb();
        }

        function tab(t) {
            document.getElementById('tab-shoot').classList.toggle('hidden', t !== 'shoot');
            document.getElementById('tab-stats').classList.toggle('hidden', t !== 'stats');
        }

        function broadcast() {
            const txt = document.getElementById('t-q').value.trim();
            if (!txt) return alert("اكتب السؤال!");
            const audio = new (window.AudioContext || window.webkitAudioContext)();
            const o = audio.createOscillator(), g = audio.createGain();
            o.frequency.setValueAtTime(2800, audio.currentTime); o.frequency.linearRampToValueAtTime(3200, audio.currentTime + 0.15);
            g.gain.setValueAtTime(0.3, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.35);
            o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.35);

            if (db) db.ref('tournament_final/active_q').set({ text: txt, options: ["صح", "خطأ"], correct: 0 });
            alert("✅ تمت الصافرة وتعميم السؤال على شاشات الطلاب.");
        }

        function listenDb() {
            if (!db) return;
            db.ref('tournament_final').on('value', (s) => {
                const d = s.val();
                if (d && d.active_q) {
                    const txtEl = document.getElementById('q-text');
                    if (txtEl) txtEl.innerText = d.active_q.text;
                    const box = document.getElementById('corners-box');
                    if (box) {
                        box.innerHTML = '';
                        d.active_q.options.forEach(opt => {
                            const b = document.createElement('button');
                            b.className = "corner-btn rounded-xl py-2 text-xs font-black";
                            b.innerText = opt;
                            b.onclick = () => { alert("⚽ تم تسجيل تسديدتك بنجاح!"); };
                            box.appendChild(b);
                        });
                    }
                }
            });
        }

        render();
    </script>
</body>
</html>
