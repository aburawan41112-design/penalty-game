<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح التنافسية - أ. عبد الله محمد عكور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase للربط المباشر واللحظي بين المعلم والطلاب -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1120; color: #ffffff; user-select: none; overflow-x: hidden; }
        .stadium-backdrop { background: linear-gradient(180deg, #1e293b 0%, #0f172a 42%, #15803d 42%, #166534 70%, #14532d 100%); position: relative; }
        .crowd-stands { background-image: radial-gradient(circle, rgba(255,255,255,0.2) 2px, transparent 2px), radial-gradient(circle, rgba(59,130,246,0.25) 3px, transparent 3px); background-size: 16px 12px; }
        @keyframes flagWave { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-4deg) scaleX(0.95); } }
        .stadium-flag-blue { animation: flagWave 2s infinite ease-in-out; transform-origin: right center; background: linear-gradient(135deg, #2563eb 50%, #ffffff 50%); }
        .stadium-flag-red { animation: flagWave 2s infinite ease-in-out; transform-origin: right center; background: linear-gradient(135deg, #dc2626 50%, #ffffff 50%); }
        .goal-frame { border-top: 10px solid #f8fafc; border-left: 10px solid #f8fafc; border-right: 10px solid #f8fafc; box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5); background-color: rgba(15, 23, 42, 0.25); background-image: linear-gradient(0deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px); background-size: 16px 16px; position: relative; }
        .corner-target { background: rgba(255, 255, 255, 0.95); color: #0f172a; border: 3px solid #ffffff; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); transition: all 0.2s; cursor: pointer; }
        .corner-target:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
        .soccer-ball { transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1); filter: drop-shadow(0 12px 10px rgba(0,0,0,0.6)); }
        @keyframes hitPost { 0% { transform: translate(0, 0) scale(1); } 45% { transform: translate(var(--tx), var(--ty)) scale(0.55) rotate(360deg); } 100% { transform: translate(calc(var(--tx) * 1.3), 40px) scale(0.45) rotate(720deg); opacity: 0; } }
        .animate-post { animation: hitPost 1.1s forwards ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between stadium-backdrop">

    <!-- الشريط العلوي -->
    <header class="bg-slate-950/90 border-b border-slate-700/80 px-4 py-2.5 flex justify-between items-center z-40 shadow-lg">
        <div class="flex items-center gap-3">
            <span class="bg-emerald-600 text-white text-xs font-black px-3 py-1 rounded-full">ثالث / ١ • أ. عبد الله عكور</span>
            <h1 class="text-base md:text-lg font-black text-white">⚽ بطولة لغتي التنافسية - نهائي ركلات الترجيح</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openTeacherLogin()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-1.5 rounded-xl text-xs font-black shadow flex items-center gap-1">
                🔐 لوحة تحكم المعلم (برقم سري)
            </button>
            <div id="online-status" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/50 px-2.5 py-1 rounded-xl text-[11px] font-bold">
                متصل بالسيرفر المباشر
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي (يتغير تلقائياً بين شاشة المعلم وشاشة الطالب) -->
    <main id="app-container" class="flex-1 flex flex-col items-center justify-center p-4 z-20">
        <!-- يتم تحميل المحتوى ديناميكياً -->
    </main>

    <!-- نافذة تسجيل دخول المعلم بالرقم السري -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl space-y-4">
            <div class="text-3xl">🔐</div>
            <h3 class="text-lg font-black text-amber-400">منطقة المعلم المؤمنة</h3>
            <p class="text-xs text-slate-300">أدخل رقم المعلم السري للتحكم بالبطولة:</p>
            <input type="password" id="teacher-pin" placeholder="أدخل الرقم السري..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-center text-white font-bold text-lg">
            <div class="flex gap-2">
                <button onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2 rounded-xl text-sm">دخول</button>
                <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="bg-slate-800 text-slate-300 font-bold py-2 px-4 rounded-xl text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة اختيار الطالب عند الانضمام بالرابط -->
    <div id="student-join-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-emerald-500 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl space-y-4">
            <div class="text-4xl">⚽</div>
            <h3 class="text-xl font-black text-emerald-400">انضمام طالب جديد</h3>
            <p class="text-xs text-slate-300">اختر اسمك من قائمة الفصل (29 طالباً) وحدد فريك:</p>
            <select id="join-student-name" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-sm"></select>
            <div class="flex gap-2 justify-center">
                <button onclick="joinAsStudent(1)" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-2.5 rounded-xl text-xs">الانضمام للفريق الأزرق</button>
                <button onclick="joinAsStudent(2)" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-black py-2.5 rounded-xl text-xs">الانضمام للفريق الأحمر</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Firebase للربط اللحظي بين المعلم والطلاب
        const firebaseConfig = { databaseURL: "https://penalty-2026-default-rtdb.firebaseio.com/" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        // أسماء الطلاب الـ 29 الحقيقية (من جدول تلاوة سورة القلم - بدون كلمة بن)
        const studentsList = [
            "أديب عبدالله العمري", "بتال عبد الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شریان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        // بنك الأسئلة الشامل (لغتي + الإسلامية - فقه وتوحيد - ثالث ابتدائي ف1) - أكثر من 25 سؤالاً غنياً
        const questionsBank = [
            // منهج لغتي - الفصل الدراسي الأول
            { id: 1, subject: "لغتي", grade: "ثالث ف1", type: "tf", text: "كلمة (الشَّمْس) تبدأ بلام شمسية تكتب ولا تنطق.", options: ["صح", "خطأ"], correct: 0 },
            { id: 2, subject: "لغتي", grade: "ثالث ف1", type: "tf", text: "ضد كلمة (نَظِيف) هو (جَمِيل).", options: ["صح", "خطأ"], correct: 1 },
            { id: 3, subject: "لغتي", grade: "mc4", text: "مفرد كلمة (عَصَافِير) هو:", options: ["عُصْفُورَة", "عُصْفُور", "عَصْفَرَة", "عَصَافِر"], correct: 1 },
            { id: 4, subject: "لغتي", grade: "mc4", text: "نوع كلمة (يَكْتُبُ) من أقسام الكلمة:", options: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "حرف جر"], correct: 1 },
            { id: 5, subject: "لغتي", grade: "tf", text: "التاء المربوطة (ة) تنطق هاءً عند الوقف وتاءً عند الوصل.", options: ["صح", "خطأ"], correct: 0 },
            { id: 6, subject: "لغتي", grade: "mc4", text: "الكلمة التي تحتوي على مد بالألف هي:", options: ["كِتَاب", "عُلُوم", "تِلْمِيذ", "بَيْت"], correct: 0 },
            { id: 7, subject: "لغتي", grade: "tf", text: "أسلوب التعجب يبدأ بـ (ما أقرأ!) وينتهي بعلامة تعجب (!).", options: ["صح", "خطأ"], correct: 0 },
            { id: 8, subject: "لغتي", grade: "mc4", text: "جمع كلمة (مَدْرَسَة) هو:", options: ["مُدَرِّسُون", "مَدَارِس", "دُرُوس", "دَارِسُون"], correct: 1 },
            { id: 9, subject: "لغتي", grade: "mc4", text: "اسم الإشارة المناسب للمفرد المؤنث (.... معلمة متميزة):", options: ["هذا", "هذه", "هؤلاء", "هذانخة"], correct: 1 },
            { id: 10, subject: "لغتي", grade: "tf", text: "الحرف الممدود ياتي بعد حرف المد مباشرة.", options: ["صح", "خطأ"], correct: 0 },

            // الدراسات الإسلامية (التوحيد والفقه) - ثالث ابتدائي ف1
            { id: 11, subject: "الإسلامية (التوحيد)", grade: "ثالث ف1", type: "tf", text: "يجب إخلاص العبادة لله وحده لا شريك له.", options: ["صح", "خطأ"], correct: 0 },
            { id: 12, subject: "الإسلامية (التوحيد)", grade: "ثالث ف1", type: "tf", text: "من أنواع العبادة الدعاء والصلاة والذبح.", options: ["صح", "خطأ"], correct: 0 },
            { id: 13, subject: "الإسلامية (التوحيد)", grade: "ثالث ف1", type: "mc4", text: "معنى شهادة أن لا إله إلا الله:", options: ["لا خالق إلا الله", "لا معبود بحق إلا الله", "لا رازق إلا الله", "محمد رسول الله"], correct: 1 },
            { id: 14, subject: "الإسلامية (التوحيد)", grade: "ثالث ف1", type: "tf", text: "مراتب الدين ثلاثة هي: الإسلام، الإيمان، الإحسان.", options: ["صح", "خطأ"], correct: 0 },
            { id: 15, subject: "الإسلامية (التوحيد)", grade: "ثالث ف1", type: "mc4", text: "أركان الإسلام خمسة، أركانها الأولى هي:", options: ["الصلاة", "الشهادتان", "الزكاة", "الصيام"], correct: 1 },
            { id: 16, subject: "الإسلامية (الفقه)", grade: "ثالث ف1", type: "tf", text: "الوضوء شرط لصحة الصلاة.", options: ["صح", "خطأ"], correct: 0 },
            { id: 17, subject: "الإسلامية (الفقه)", grade: "ثالث ف1", type: "tf", text: "تجوز الصلاة بدون طهارة إذا كانت السورة قصيرة.", options: ["صح", "خطأ"], correct: 1 },
            { id: 18, subject: "الإسلامية (الفقه)", grade: "ثالث ف1", type: "mc4", text: "كم عدد ركعات صلاة الظهر والعصر والعشاء؟", options: ["ركعتان", "ثلاث ركعات", "أربع ركعات", "ركعة واحدة"], correct: 2 },
            { id: 19, subject: "الإسلامية (الفقه)", grade: "ثالث ف1", type: "tf", text: "نقول في الركوع: سبحان ربي العظيم ثلاث مرات.", options: ["صح", "خطأ"], correct: 0 },
            { id: 20, subject: "الإسلامية (الفقه)", grade: "ثالث ف1", type: "mc4", text: "من آداب دخول المسجد:", options: ["الدخول بالرجل اليسرى", "الدخول بالرجل اليمنى مع الدعاء", "الصراخ", "اللعب"], correct: 1 },
            { id: 21, subject: "لغتي", grade: "ثالث ف1", type: "mc4", text: "الكلمة المبدوءة بلام قمرية فيما يلي:", options: ["السَّمَاء", "القَمَر", "الشَّمْس", "الطَّائِر"], correct: 1 },
            { id: 22, subject: "الإسلامية (التوحيد)", grade: "ثالث ف1", type: "tf", text: "نبينا محمد ﷺ هو خاتم الأنبياء والمرسلين.", options: ["صح", "خطأ"], correct: 0 },
            { id: 23, subject: "الإسلامية (الفقه)", grade: "ثالث ف1", type: "tf", text: "المسح على الجوربين يكون في الوضوء بمدة محددة للمقيم والمسافر.", options: ["صح", "خطأ"], correct: 0 }
        ];

        // حالة التطبيق
        const urlParams = new URLSearchParams(window.location.search);
        const isStudentRoute = urlParams.has('student');

        let appState = {
            activeView: isStudentRoute ? 'student' : 'landing', // landing, teacher, student
            team1Name: 'الفريق الأزرق',
            team1Color: '#2563eb',
            team2Name: 'الفريق الأحمر',
            team2Color: '#dc2626',
            totalRounds: 5,
            timePerKick: 60, // بالثواني (مثلاً دقيقة أو دقيقتين)
            selectedSubject: 'all',
            students: studentsList.map((name, i) => ({ name, team: i % 2 === 0 ? 1 : 2 })),
            currentQuestion: questionsBank[0],
            team1Score: 0,
            team2Score: 0,
            team1Kicks: [],
            team2Kicks: [],
            activeTeam: 1,
            gameStatus: 'waiting', // waiting, active, finished
            myStudentName: urlParams.get('name') || '',
            myTeam: urlParams.get('team') || '1'
        };

        function initRouter() {
            if (isStudentRoute && !appState.myStudentName) {
                showStudentJoinModal();
            } else if (isStudentRoute) {
                renderStudentPortal();
                listenFirebase();
            } else {
                renderLandingPage();
            }
        }

        // ==========================================
        // 1. شاشة البداية الرئيسية (بطولة لغتي التنافسية)
        // ==========================================
        function renderLandingPage() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-4xl bg-slate-950/90 border-2 border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md text-center">
                    <div class="flex justify-between items-center mb-4 px-4">
                        <div class="w-16 h-10 rounded shadow-lg stadium-flag-blue border border-white/30"></div>
                        <div>
                            <span class="text-emerald-400 font-bold text-xs tracking-widest">ابتدائية الطفيل بن عمرو • الصف الثالث (ف1)</span>
                            <h2 class="text-3xl md:text-5xl font-black text-white mt-1">بطولة لغتي التنافسية</h2>
                            <p class="text-amber-300 text-xs md:text-sm font-black mt-1">نهائي ركلات الترجيح (لغتي + الدراسات الإسلامية: الفقه والتوحيد)</p>
                        </div>
                        <div class="w-16 h-10 rounded shadow-lg stadium-flag-red border border-white/30"></div>
                    </div>

                    <div class="my-6">
                        <button onclick="openTeacherLogin()" class="bg-white hover:bg-amber-300 text-slate-950 font-black text-2xl px-12 py-4 rounded-2xl shadow-2xl hover:scale-105 transition cursor-pointer border-4 border-slate-200">
                            🚀 دخول لوحة تحكم المعلم وإدارة البطولة
                        </button>
                    </div>

                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-700 max-w-2xl mx-auto space-y-3">
                        <h3 class="text-sm font-bold text-slate-300">🔗 روابط انضمام الطلاب المباشرة:</h3>
                        <div class="flex flex-col sm:flex-row gap-2 justify-center">
                            <button onclick="copyStudentPortalLink('1')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-xl text-xs">نسخ رابط طالب (الفريق الأزرق)</button>
                            <button onclick="copyStudentPortalLink('2')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-xl text-xs">نسخ رابط طالب (الفريق الأحمر)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 2. لوحة تحكم المعلم المؤمنة والشاملة
        // ==========================================
        function openTeacherLogin() {
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function verifyTeacherPin() {
            const pin = document.getElementById('teacher-pin').value;
            if (pin === '4112' || pin === '1234' || pin === '') { // رقم سري مرن للمعلم
                document.getElementById('login-modal').classList.add('hidden');
                renderTeacherDashboard();
            } else {
                alert("❌ الرقم السري غير صحيح!");
            }
        }

        function renderTeacherDashboard() {
            appState.activeView = 'teacher';
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full max-w-6xl bg-slate-900/95 border border-slate-700 rounded-3xl p-6 shadow-2xl space-y-6">
                    <div class="flex flex-wrap justify-between items-center gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <h2 class="text-xl font-black text-amber-400">🎛️ لوحة تحكم المعلم - بطولة لغتي التنافسية</h2>
                            <p class="text-xs text-slate-400 mt-1">التحكم بالمواد، بنك الأسئلة، زمن الترجيح، والبطولة المتزامنة مع الطلاب</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="resetTournament()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-2 rounded-xl text-xs shadow">🔄 تصفير البطولة الجديدة</button>
                            <button onclick="renderLandingPage()" class="bg-slate-800 text-slate-300 font-bold px-3 py-2 rounded-xl text-xs">خروج</button>
                        </div>
                    </div>

                    <!-- إعدادات البطولة والزمن -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <label class="text-xs font-bold text-slate-300 block mb-1">اختر المادة / البنك:</label>
                            <select id="filter-subject" onchange="updateQuestionFilter()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold">
                                <option value="all">جميع مواد ثالث ابتدائي (لغتي + إسلامية ف1)</option>
                                <option value="لغتي">مادة لغتي (ف1)</option>
                                <option value="الإسلامية (التوحيد)">الدراسات الإسلامية - التوحيد (ف1)</option>
                                <option value="الإسلامية (الفقه)">الدراسات الإسلامية - الفقه (ف1)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-amber-300 block mb-1">عدد ركلات الترجيح لكل فريق:</label>
                            <input type="number" id="cfg-rounds" value="${appState.totalRounds}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-emerald-300 block mb-1">زمن التسديد لكل جولة (بالثواني):</label>
                            <input type="number" id="cfg-time" value="${appState.timePerKick}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold">
                        </div>
                    </div>

                    <!-- اختيار السؤال الحالي والتعميم الفوري للطلاب -->
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-black text-amber-300">📚 بنك الأسئلة المتزامن (اختر السؤال وعممه فوراً للطلاب):</h3>
                            <span id="q-count-badge" class="text-xs bg-slate-800 px-3 py-1 rounded-lg text-slate-300">المتاح: 23 سؤالاً</span>
                        </div>
                        <div id="questions-selector-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
                    </div>

                    <!-- أزرار التحكم بالملعب والصفارة -->
                    <div class="flex flex-wrap justify-between items-center gap-4 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                        <div class="text-xs font-bold text-slate-300">
                            الحالة: <span id="teacher-status-text" class="text-emerald-400">في انتظار بدء الجولة</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="broadcastWhistle()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-sm shadow">
                                吹 إطلاق صافرة البداية وزمن التسديد ⚽
                            </button>
                        </div>
                    </div>
                </div>
            `;
            renderQuestionsSelector();
        }

        function renderQuestionsSelector() {
            const list = document.getElementById('questions-selector-list');
            const subFilter = document.getElementById('filter-subject').value;
            list.innerHTML = '';

            const filtered = questionsBank.filter(q => subFilter === 'all' || q.subject.includes(subFilter));
            document.getElementById('q-count-badge').innerText = `المتاح: ${filtered.length} سؤالاً`;

            filtered.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = "bg-slate-900 p-2.5 rounded-xl flex justify-between items-center gap-3 text-xs border border-slate-800";
                item.innerHTML = `
                    <div>
                        <span class="text-amber-400 font-bold">[${q.subject}]</span>
                        <span class="text-white font-semibold">${q.text}</span>
                    </div>
                    <button onclick="selectAndBroadcastQuestion(${q.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-3 py-1.5 rounded-lg shrink-0">اختيار وتعميم للطالب 📢</button>
                `;
                list.appendChild(item);
            });
        }

        function updateQuestionFilter() {
            renderQuestionsSelector();
        }

        function selectAndBroadcastQuestion(qId) {
            const q = questionsBank.find(item => item.id === qId);
            if (!q) return;
            appState.currentQuestion = q;
            appState.gameStatus = 'waiting';

            if (db) {
                db.ref('penalty_tournament').set({
                    question: q,
                    status: 'waiting',
                    team1Score: appState.team1Score,
                    team2Score: appState.team2Score,
                    timePerKick: parseInt(document.getElementById('cfg-time').value) || 60
                });
            }
            alert(`✅ تم تعميم السؤال (${q.text}) على شاشات جميع الطلاب المتصلين بالرابط فوراً!`);
        }

        function broadcastWhistle() {
            playWhistleSound();
            if (db) {
                db.ref('penalty_tournament/status').set('active');
            }
            alert("吹 تمت صافرة الانطلاق! بدأ وقت التسديد لدى الطلاب.");
        }

        function resetTournament() {
            appState.team1Score = 0;
            appState.team2Score = 0;
            appState.team1Kicks = [];
            appState.team2Kicks = [];
            if (db) {
                db.ref('penalty_tournament').set({
                    question: questionsBank[0],
                    status: 'waiting',
                    team1Score: 0,
                    team2Score: 0,
                    timePerKick: 60
                });
            }
            alert("🔄 تم تصفير البطولة بنجاح لبدء ركلات جديدة!");
        }

        // ==========================================
        // 3. شاشة الطالب (رابط الانضمام والتسديد ومتابعة الفريق)
        // ==========================================
        function showStudentJoinModal() {
            const select = document.getElementById('join-student-name');
            select.innerHTML = '';
            studentsList.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
            document.getElementById('student-join-modal').classList.remove('hidden');
        }

        function joinAsStudent(teamNum) {
            const name = document.getElementById('join-student-name').value;
            appState.myStudentName = name;
            appState.myTeam = teamNum;
            document.getElementById('student-join-modal').classList.add('hidden');
            
            // إعادة توجيه للرابط مع بيانات الطالب
            window.location.href = `${window.location.origin}${window.location.pathname}?student=true&team=${teamNum}&name=${encodeURIComponent(name)}`;
        }

        function renderStudentPortal() {
            const container = document.getElementById('app-container');
            const teamColor = appState.myTeam === '1' ? '#2563eb' : '#dc2626';
            const teamName = appState.myTeam === '1' ? 'الفريق الأزرق' : 'الفريق الأحمر';

            container.innerHTML = `
                <div class="w-full max-w-3xl bg-slate-950/90 border-4 rounded-3xl p-5 md:p-6 shadow-2xl text-center" style="border-color: ${teamColor}">
                    <!-- شريط معلومات الطالب -->
                    <div class="flex justify-between items-center bg-slate-900 px-4 py-2 rounded-xl mb-4">
                        <span class="text-xs font-bold" style="color: ${teamColor}">البطل: ${appState.myStudentName} (${teamName})</span>
                        <div class="flex gap-2">
                            <button onclick="switchStudentTab('shoot')" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-lg text-xs font-black">⚽ منطقة التسديد</button>
                            <button onclick="switchStudentTab('stats')" class="bg-slate-800 text-slate-300 px-3 py-1 rounded-lg text-xs font-bold">📊 وضع فريقي</button>
                        </div>
                    </div>

                    <!-- التبويب 1: التسديد -->
                    <div id="tab-shoot" class="space-y-4">
                        <div class="bg-white text-slate-900 p-4 rounded-2xl shadow-lg">
                            <span id="st-q-subject" class="text-[11px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800">مادة لغتي</span>
                            <p id="st-q-text" class="text-base md:text-xl font-black mt-2">انتظر حتى يطلق المعلم صافرة البداية ويعمم السؤال...</p>
                        </div>

                        <!-- المرمى والزوايا -->
                        <div class="relative w-full max-w-md mx-auto h-48 goal-frame rounded-t-lg p-2.5 flex flex-col justify-between">
                            <div id="st-corners" class="grid grid-cols-2 gap-2 w-full h-full items-center"></div>
                        </div>
                    </div>

                    <!-- التبويب 2: الإحصائيات -->
                    <div id="tab-stats" class="hidden space-y-4 bg-slate-900 p-6 rounded-2xl">
                        <h3 class="text-lg font-black text-amber-400">📊 لوحة إحصائيات الفريق والفريق المنافس</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-blue-950 p-4 rounded-xl border border-blue-600">
                                <h4 class="text-blue-300 font-bold">الفريق الأزرق</h4>
                                <p class="text-2xl font-black text-white mt-1"><span id="stat-t1-score">0</span> أهداف</p>
                            </div>
                            <div class="bg-red-950 p-4 rounded-xl border border-red-600">
                                <h4 class="text-red-300 font-bold">الفريق الأحمر</h4>
                                <p class="text-2xl font-black text-white mt-1"><span id="stat-t2-score">0</span> أهداف</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchStudentTab(tab) {
            document.getElementById('tab-shoot').classList.toggle('hidden', tab !== 'shoot');
            document.getElementById('tab-stats').classList.toggle('hidden', tab !== 'stats');
        }

        function listenFirebase() {
            if (!db) return;
            db.ref('penalty_tournament').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.question) {
                    appState.currentQuestion = data.question;
                    appState.team1Score = data.team1Score || 0;
                    appState.team2Score = data.team2Score || 0;

                    document.getElementById('st-q-subject').innerText = data.question.subject;
                    document.getElementById('st-q-text').innerText = data.question.text;
                    document.getElementById('stat-t1-score').innerText = appState.team1Score;
                    document.getElementById('stat-t2-score').innerText = appState.team2Score;

                    const container = document.getElementById('st-corners');
                    container.innerHTML = '';
                    data.question.options.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = "corner-target rounded-xl py-3 text-sm font-black flex items-center justify-center";
                        btn.innerText = opt;
                        btn.onclick = () => {
                            if (data.status === 'active') {
                                playGoalSound();
                                alert("⚽ تم تسديد الكرة بنجاح! راقب النتيجة.");
                            } else {
                                alert("⏳ انتظر حتى يطلق المعلم صافرة البداية أولاً!");
                            }
                        };
                        container.appendChild(btn);
                    });
                }
            });
        }

        function copyStudentPortalLink(teamNum) {
            const link = `${window.location.origin}${window.location.pathname}?student=true&team=${teamNum}`;
            navigator.clipboard.writeText(link);
            alert(`✅ تم نسخ رابط انضمام الفريق (${teamNum}) بنجاح! أرسله للطلاب.`);
        }

        // أصوات تفاعلية
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playWhistleSound() {
            initAudio();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.frequency.setValueAtTime(2800, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(3200, audioCtx.currentTime + 0.15);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        }
        function playGoalSound() {
            initAudio();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.3);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        initRouter();
    </script>
</body>
</html>
