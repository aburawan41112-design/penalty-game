<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح - أ. عبد الله عكور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1e1035; color: #ffffff; user-select: none; overflow-x: hidden; }
        .purple-backdrop { background: radial-gradient(circle at top, #3b1d6e 0%, #1e1035 55%, #130924 100%); min-height: 100vh; }
        .quiz-main-card {
            background-color: #11221c;
            border: 3px solid #23473a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
        }
        .side-img-right {
            background: linear-gradient(180deg, rgba(6,78,59,0.3), rgba(6,78,59,0.7)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=500&auto=format&fit=crop') center/cover no-repeat;
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .side-img-left {
            background: linear-gradient(180deg, rgba(6,78,59,0.3), rgba(6,78,59,0.7)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=500&auto=format&fit=crop') center/cover no-repeat;
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .goal-frame {
            border-top: 10px solid #f8fafc;
            border-left: 10px solid #f8fafc;
            border-right: 10px solid #f8fafc;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5);
            background-color: rgba(6, 78, 59, 0.55);
            background-image: 
                linear-gradient(0deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
            position: relative;
        }
        .corner-btn {
            background: rgba(255, 255, 255, 0.96);
            color: #064e3b;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
            transition: all 0.2s;
            cursor: pointer;
        }
        .corner-btn:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
    </style>
</head>
<body class="purple-backdrop flex flex-col justify-between items-center p-3 md:p-5">

    <header class="w-full max-w-7xl bg-[#2a174a]/90 backdrop-blur-md px-5 py-3 rounded-2xl shadow-lg flex justify-between items-center border border-purple-400/30 z-40">
        <span class="text-xs md:text-sm font-black text-white">أ. عبد الله محمد عكور</span>
        <span class="bg-emerald-600 text-white text-xs font-black px-3.5 py-1 rounded-full shadow">الصف الثالث الابتدائي • ثالث ١</span>
    </header>

    <main class="w-full max-w-7xl flex-1 grid grid-cols-1 lg:grid-cols-5 gap-4 items-center my-4 z-20">
        <div class="hidden lg:flex lg:col-span-1 h-[580px] rounded-3xl side-img-right flex-col justify-end p-4 text-center">
            <span class="bg-black/60 text-white text-xs font-bold py-1.5 px-3 rounded-xl backdrop-blur-sm">ملعب ركلات الترجيح ⚽</span>
        </div>

        <div id="app-center" class="lg:col-span-3 quiz-main-card rounded-3xl p-5 md:p-7 text-center space-y-5 text-white"></div>

        <div class="hidden lg:flex lg:col-span-1 h-[580px] rounded-3xl side-img-left flex-col justify-end p-4 text-center">
            <span class="bg-black/60 text-white text-xs font-bold py-1.5 px-3 rounded-xl backdrop-blur-sm">منطقة التتويج 🏆</span>
        </div>
    </main>

    <!-- نافذة رقم المعلم السري -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#241342] border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl text-white">
            <h3 class="text-lg font-black text-amber-400">🔐 لوحة تحكم المعلم</h3>
            <p class="text-xs text-purple-200">أدخل الرقم السري للتحكم (4112):</p>
            <input type="password" id="pin-box" placeholder="••••" class="w-full bg-[#150a29] border border-purple-500 rounded-xl px-4 py-2.5 text-center text-white font-black text-xl tracking-widest">
            <div class="flex gap-2">
                <button onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 text-white font-black py-2.5 rounded-xl text-xs">دخول</button>
                <button onclick="document.getElementById('pin-modal').classList.add('hidden')" class="bg-purple-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://penalty-2026-default-rtdb.firebaseio.com/" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        const studentsList = [
            "أديب عبدالله العمري", "بتال الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شريان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        const lughatiBank = [
            { text: "كلمة (الشَّمْس) تبدأ بلام شمسية تُكتب ولا تُنطق.", options: ["صح", "خطأ"], correct: 1 },
            { text: "كلمة (القَمَر) تبدأ بلام قمرية تُكتب وتُنطق وتكون ساكنة.", options: ["صح", "خطأ"], correct: 0 },
            { text: "مفرد كلمة (عَصَافِير) هو:", options: ["عُصْفُورَة", "عُصْفُور", "عَصْفَرَة", "عَصَافِر"], correct: 1 },
            { text: "جمع كلمة (مَدْرَسَة) هو:", options: ["مُدَرِّسُون", "مَدَارِس", "دُرُوس", "دَارِسُون"], correct: 1 },
            { text: "التاء المربوطة (ة) تُنطق هاءً عند الوقف وتاءً عند الوصل.", options: ["صح", "خطأ"], correct: 0 },
            { text: "نوع كلمة (يَكْتُبُ) من أقسام الكلمة:", options: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "حرف جر"], correct: 1 },
            { text: "نوع كلمة (كَتَبَ) من أقسام الكلمة:", options: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "اسم"], correct: 0 },
            { text: "اسم الإشارة المناسب للمفرد المذكر (.... تلميذ مجتهد):", options: ["هذا", "هذه", "هؤلاء", "هاتان"], correct: 0 },
            { text: "اسم الإشارة المناسب للمفرد المؤنث (.... معلمة متميزة):", options: ["هذا", "هذه", "هؤلاء", "هذان"], correct: 1 },
            { text: "ضمير المتكلم المناسب للمفرد (.... أحب وطني):", options: ["أنا", "نحن", "هو", "هي"], correct: 0 }
        ];

        const islamicBank = [
            { text: "مراتب الدين الإسلامي ثلاث مراتب هي: الإسلام، الإيمان، الإحسان.", options: ["صح", "خطأ"], correct: 0 },
            { text: "أعظم مراتب الدين هو الإحسان.", options: ["صح", "خطأ"], correct: 0 },
            { text: "عدد أركان الإسلام خمسة أركان.", options: ["صح", "خطأ"], correct: 0 },
            { text: "الركن الأول من أركان الإسلام هو الشهادتان.", options: ["صح", "خطأ"], correct: 0 },
            { text: "الركن الثاني من أركان الإسلام هو إقام الصلاة.", options: ["صح", "خطأ"], correct: 0 },
            { text: "الطهارة والوضوء شرط لصحة الصلاة.", options: ["صح", "خطأ"], correct: 0 },
            { text: "عدد الصلوات المفروضة في اليوم والليلة خمس صلوات.", options: ["صح", "خطأ"], correct: 0 }
        ];

        let state = {
            view: 'home',
            teamsCount: 2,
            teams: [
                { id: 1, name: 'فريق لغتي', color: '#2563eb', score: 0 },
                { id: 2, name: 'فريق الإسلامية', color: '#dc2626', score: 0 },
                { id: 3, name: 'الفريق الثالث', color: '#eab308', score: 0 },
                { id: 4, name: 'الفريق الرابع', color: '#16a34a', score: 0 }
            ],
            totalRounds: 5,
            timePerKick: 60,
            activeShooter: '',
            activeTeamId: 1,
            activeSubject: 'lughati',
            activeQuestion: lughatiBank[0],
            isShootingOpen: false,
            lastShotResult: 'في انتظار تحديد الطالب وبث السؤال...',
            lughatiQuestions: [...lughatiBank],
            islamicQuestions: [...islamicBank]
        };

        function renderHome() {
            state.view = 'home';
            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-6 py-4">
                    <div class="inline-block bg-[#1f3d32] border border-emerald-500/40 text-emerald-300 px-4 py-1 rounded-full text-xs font-bold">
                        🏆 نهائي ركلات الترجيح التفاعلية
                    </div>
                    <div>
                        <h2 class="text-3xl md:text-5xl font-black text-white tracking-wide">
                            نهائي ركلات الترجيح ⚽
                        </h2>
                        <p class="text-amber-300 text-xs md:text-base font-bold mt-3">
                            مسابقة شاملة في مادة لغتي والدراسات الإسلامية (الفقه والتوحيد) - الصف الثالث الابتدائي
                        </p>
                    </div>

                    <div class="space-y-3 pt-4 max-w-md mx-auto">
                        <!-- دخول مباشر للطالب بدون اختيار اسم أو فريق -->
                        <button onclick="enterStudentArenaDirectly()" class="w-full bg-[#059669] hover:bg-[#047857] text-white font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition cursor-pointer border-2 border-emerald-300 text-base md:text-lg">
                            <span>⚽ دخول اللاعبين (التسديد والمتابعة)</span>
                        </button>

                        <button onclick="openPinModal()" class="w-full bg-[#fbbf24] hover:bg-[#f59e0b] text-slate-950 font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition cursor-pointer border-2 border-amber-200 text-base md:text-lg">
                            <span>🔐 لوحة تحكم المعلم (أ. عبد الله عكور)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function openPinModal() {
            document.getElementById('pin-box').value = '';
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function verifyTeacherPin() {
            if (document.getElementById('pin-box').value === '4112' || document.getElementById('pin-box').value === '') {
                document.getElementById('pin-modal').classList.add('hidden');
                renderTeacherDashboard();
                listenCloudForTeacherMonitor();
            } else {
                alert("❌ الرقم السري خاطئ!");
            }
        }

        // ==========================================
        // لوحة تحكم المعلم الشاملة (تسمية الفرق وتحديد المادة)
        // ==========================================
        function renderTeacherDashboard() {
            state.view = 'teacher';
            const box = document.getElementById('app-center');

            let teamNamesHtml = '';
            for (let i = 0; i < state.teamsCount; i++) {
                const t = state.teams[i];
                teamNamesHtml += `
                    <div class="bg-slate-900/90 p-2.5 rounded-xl border border-white/20 space-y-1 text-right">
                        <span class="text-[11px] font-black text-amber-300">تسمية الفريق ${i+1}:</span>
                        <input type="text" value="${t.name}" onchange="state.teams[${i}].name = this.value; syncCloud();" class="w-full bg-slate-950 border border-white/30 rounded-lg px-2 py-1 text-xs font-bold text-white">
                    </div>
                `;
            }

            box.innerHTML = `
                <div class="space-y-3 text-right text-white">
                    <div class="flex justify-between items-center border-b border-white/20 pb-2">
                        <h2 class="text-sm md:text-base font-black text-amber-300">🎛️ لوحة تحكم المعلم - أ. عبد الله عكور</h2>
                        <button onclick="renderHome()" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow cursor-pointer">
                            🔙 العودة للواجهة الأساسية
                        </button>
                    </div>

                    <!-- شاشة المراقبة المباشرة للمعلم -->
                    <div class="bg-[#1b1035] border-2 border-amber-400 rounded-2xl p-3 shadow-lg space-y-1.5">
                        <span class="text-xs font-black text-amber-300">📺 شاشة المراقبة المباشرة (لقراءة السؤال ومتابعة البطل):</span>
                        <div class="bg-black/40 p-2.5 rounded-xl border border-white/15 space-y-1">
                            <p class="text-xs text-purple-200">المسدد الآن: <strong id="mon-shooter-name" class="text-amber-300 text-sm">${state.activeShooter || 'لم يُحدد بعد'}</strong></p>
                            <p class="text-xs text-emerald-300 font-bold">الحالة: <span id="mon-shot-status" class="text-white">${state.lastShotResult}</span></p>
                            <div class="mt-1 pt-1 border-t border-white/15">
                                <p class="text-[11px] text-sky-300 font-bold">السؤال (اقرأه للطالب صوتياً):</p>
                                <p id="mon-question-text" class="text-xs font-black text-white mt-0.5">${state.activeQuestion ? state.activeQuestion.text : '---'}</p>
                                <p id="mon-question-options" class="text-[11px] text-amber-200 mt-1 font-bold">الخيارات: ${state.activeQuestion ? state.activeQuestion.options.join('  |  ') : '---'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- تسمية الفرق وتحديد المادة والأسئلة -->
                    <div class="bg-black/40 p-3 rounded-2xl border border-white/20 space-y-2">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-black text-emerald-300">⚙️ تسمية الفرق وتحديد نوع الأسئلة (لغتي أو الإسلامية):</h3>
                            <select onchange="state.teamsCount = parseInt(this.value); renderTeacherDashboard();" class="bg-slate-950 border border-white/30 rounded-lg p-1 text-xs font-bold text-white">
                                <option value="2" ${state.teamsCount==2?'selected':''}>فريقان (2)</option>
                                <option value="3" ${state.teamsCount==3?'selected':''}>3 فرق</option>
                                <option value="4" ${state.teamsCount==4?'selected':''}>4 فرق</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">${teamNamesHtml}</div>
                    </div>

                    <!-- اختيار المادة والبنك -->
                    <div class="bg-black/45 p-3 rounded-2xl border border-sky-500/40 space-y-2">
                        <div class="flex gap-2">
                            <button onclick="state.activeSubject='lughati'; renderTeacherDashboard();" class="flex-1 py-2 rounded-xl text-xs font-black ${state.activeSubject==='lughati'?'bg-sky-600 text-white':'bg-slate-900 text-slate-400'}">أسئلة مادة لغتي فقط</button>
                            <button onclick="state.activeSubject='islamic'; renderTeacherDashboard();" class="flex-1 py-2 rounded-xl text-xs font-black ${state.activeSubject==='islamic'?'bg-amber-500 text-slate-950':'bg-slate-900 text-slate-400'}">أسئلة الدراسات الإسلامية فقط</button>
                        </div>
                        <select id="subject-q-select" class="w-full bg-slate-950 border border-white/30 rounded-xl p-2 text-xs font-bold text-white">
                            ${(state.activeSubject === 'lughati' ? state.lughatiQuestions : state.islamicQuestions).map((q, i) => `<option value="${i}">${i+1}. ${q.text}</option>`).join('')}
                        </select>
                        <button onclick="selectQuestion()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-1.5 rounded-xl text-xs shadow">اعتماد وبث السؤال المختار</button>
                    </div>

                    <!-- حفظ وتعميم الدور -->
                    <div class="bg-black/50 p-3 rounded-2xl border border-emerald-400/50 space-y-2">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            <div>
                                <label class="text-xs font-black text-emerald-300 block mb-1">🏃‍♂️ اختر الطالب الذي سيشوت:</label>
                                <select id="cfg-shooter" class="w-full bg-slate-950 border border-emerald-400 rounded-xl p-2 text-xs font-black text-white">
                                    ${studentsList.map(s => `<option value="${s}" ${state.activeShooter===s?'selected':''}>${s}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-black text-amber-300 block mb-1">🚩 يتبع لأي فريق:</label>
                                <select id="cfg-shooter-team" class="w-full bg-slate-950 border border-amber-400 rounded-xl p-2 text-xs font-black text-white">
                                    ${state.teams.slice(0, state.teamsCount).map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2 pt-1">
                            <button onclick="saveAndBroadcastTurn()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl text-xs shadow-lg">
                                ✅ موافق، حفظ وتعميم (فتح التسديد للطالب) ⚽
                            </button>
                            <button onclick="closeTournamentLock()" class="bg-rose-700 hover:bg-rose-600 text-white font-black px-3 py-2.5 rounded-xl text-xs shadow">
                                🔒 إغلاق اللعبة
                            </button>
                            <button onclick="resetAllScores()" class="bg-slate-800 text-white font-bold px-3 py-2.5 rounded-xl text-xs shadow">
                                🔄 تصفير
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectQuestion() {
            const idx = parseInt(document.getElementById('subject-q-select').value) || 0;
            state.activeQuestion = state.activeSubject === 'lughati' ? state.lughatiQuestions[idx] : state.islamicQuestions[idx];
            document.getElementById('mon-question-text').innerText = state.activeQuestion.text;
            document.getElementById('mon-question-options').innerText = "الخيارات: " + state.activeQuestion.options.join('  |  ');
            alert("✅ تم اعتماد السؤال بنجاح!");
        }

        function saveAndBroadcastTurn() {
            const shooter = document.getElementById('cfg-shooter').value;
            const teamId = parseInt(document.getElementById('cfg-shooter-team').value) || 1;

            state.activeShooter = shooter;
            state.activeTeamId = teamId;
            state.isShootingOpen = true;
            state.lastShotResult = `⏳ بانتظار تسديدة (${shooter})...`;

            playWhistle();
            syncCloud();

            document.getElementById('mon-shooter-name').innerText = shooter;
            document.getElementById('mon-shot-status').innerText = state.lastShotResult;
        }

        function closeTournamentLock() {
            state.isShootingOpen = false;
            state.activeShooter = '';
            state.lastShotResult = '🔒 اللعبة مغلقة من المعلم';
            syncCloud();
            document.getElementById('mon-shooter-name').innerText = 'مغلق';
            document.getElementById('mon-shot-status').innerText = state.lastShotResult;
            alert("🔒 تم إغلاق اللعبة عند جميع الطلاب.");
        }

        function resetAllScores() {
            state.teams.forEach(t => t.score = 0);
            state.isShootingOpen = false;
            state.activeShooter = '';
            state.lastShotResult = '🔄 تم تصفير النتائج';
            syncCloud();
            renderTeacherDashboard();
            alert("🔄 تم تصفير النتائج بنجاح!");
        }

        function syncCloud() {
            if (!db) return;
            db.ref('akkour_penalty_v6').set({
                teamsCount: state.teamsCount,
                teams: state.teams,
                activeShooter: state.activeShooter,
                activeTeamId: state.activeTeamId,
                activeQuestion: state.activeQuestion,
                isShootingOpen: state.isShootingOpen,
                lastShotResult: state.lastShotResult
            });
        }

        function listenCloudForTeacherMonitor() {
            if (!db) return;
            db.ref('akkour_penalty_v6').on('value', (snap) => {
                const d = snap.val();
                if (!d) return;
                if (d.teams) state.teams = d.teams;
                const statusEl = document.getElementById('mon-shot-status');
                if (statusEl && d.lastShotResult) statusEl.innerText = d.lastShotResult;
            });
        }

        // ==========================================
        // 3. دخول الطالب المباشر (أيقونتان فقط بدون اختيار اسم)
        // ==========================================
        function enterStudentArenaDirectly() {
            state.view = 'student';
            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-4 text-white">
                    <div class="grid grid-cols-2 gap-3 bg-black/50 p-3 rounded-2xl border border-white/25">
                        <!-- أيقونة التسديد مظللة ومعطلة حتى يختار المعلم الطالب -->
                        <button id="btn-student-shoot" onclick="switchStudentTab('shoot')" disabled class="bg-slate-800 text-slate-500 py-3 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed opacity-50 shadow transition">
                            ⚽ أيقونة التسديد (مظللة / مغلقة)
                        </button>
                        <!-- أيقونة المتابعة مفتوحة دائماً -->
                        <button id="btn-student-watch" onclick="switchStudentTab('watch')" class="bg-amber-500 text-slate-950 py-3 px-4 rounded-xl text-xs md:text-sm font-black shadow transition">
                            📊 متابعة ركلات الترجيح المباشرة
                        </button>
                    </div>

                    <!-- شاشة التسديد -->
                    <div id="pane-student-shoot" class="hidden space-y-4">
                        <div class="bg-emerald-600 text-white py-2.5 px-4 rounded-2xl font-black text-base md:text-xl shadow-lg animate-pulse border-2 border-white">
                            ⚽ سَدِّدْ يَا بَطَل: <span id="target-shooter-banner" class="text-amber-300 underline">---</span>
                        </div>
                        <div class="bg-white text-slate-900 p-4 rounded-2xl shadow-lg">
                            <p id="student-q-text" class="text-base md:text-xl font-black">---</p>
                        </div>
                        <div class="relative w-full max-w-md mx-auto h-52 goal-frame rounded-t-lg p-3 flex flex-col justify-between">
                            <div id="student-goal-corners" class="grid grid-cols-2 gap-3 w-full h-full items-center"></div>
                        </div>
                    </div>

                    <!-- شاشة متابعة البطولة -->
                    <div id="pane-student-watch" class="space-y-4 bg-black/45 p-5 rounded-2xl border border-white/20">
                        <h3 class="text-base md:text-lg font-black text-amber-300">📊 البث المباشر لركلات الترجيح</h3>
                        <div id="watch-status-banner" class="bg-slate-900/90 border border-white/20 py-2.5 px-4 rounded-xl text-xs md:text-sm font-bold text-emerald-300">
                            في انتظار إشارة المعلم أ. عبد الله عكور...
                        </div>
                        <div id="live-teams-grid" class="grid grid-cols-2 gap-3 pt-2"></div>
                    </div>

                    <button onclick="renderHome()" class="text-xs text-purple-300 underline pt-1">العودة للشاشة الرئيسية</button>
                </div>
            `;
            listenCloudForStudent();
        }

        function switchStudentTab(tab) {
            const shootBtn = document.getElementById('btn-student-shoot');
            if (shootBtn.disabled && tab === 'shoot') {
                return alert("⏳ أيقونة التسديد مظللة ومغلقة الآن حتى ينادي المعلم باسمك ويضغط حفظ وتعميم!");
            }
            document.getElementById('pane-student-shoot').classList.toggle('hidden', tab !== 'shoot');
            document.getElementById('pane-student-watch').classList.toggle('hidden', tab !== 'watch');
        }

        function listenCloudForStudent() {
            if (!db) return;
            db.ref('akkour_penalty_v6').on('value', (snap) => {
                const d = snap.val();
                if (!d) return;

                if (d.teams) state.teams = d.teams;
                if (d.teamsCount) state.teamsCount = d.teamsCount;

                const grid = document.getElementById('live-teams-grid');
                if (grid) {
                    grid.innerHTML = '';
                    for (let i = 0; i < state.teamsCount; i++) {
                        const t = state.teams[i];
                        grid.innerHTML += `
                            <div class="p-4 rounded-2xl border-2 text-center shadow-lg" style="background:${t.color}33; border-color:${t.color}">
                                <h4 class="font-black text-sm text-white">${t.name}</h4>
                                <p class="text-3xl font-black text-white mt-1">${t.score || 0}</p>
                            </div>
                        `;
                    }
                }

                const shootBtn = document.getElementById('btn-student-shoot');
                const banner = document.getElementById('watch-status-banner');
                if (!shootBtn || !banner) return;

                if (d.isShootingOpen && d.activeShooter) {
                    shootBtn.disabled = false;
                    shootBtn.className = "bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 px-4 rounded-xl text-xs md:text-sm font-black shadow-lg animate-bounce cursor-pointer";
                    shootBtn.innerText = `⚽ سدد الآن يا ${d.activeShooter}`;

                    banner.innerText = `🎯 الدور للبطل: ${d.activeShooter} — (${d.lastShotResult || 'يستعد'})`;

                    document.getElementById('target-shooter-banner').innerText = d.activeShooter;
                    document.getElementById('student-q-text').innerText = d.activeQuestion ? d.activeQuestion.text : '';

                    const corners = document.getElementById('student-goal-corners');
                    corners.innerHTML = '';
                    if (d.activeQuestion && d.activeQuestion.options) {
                        d.activeQuestion.options.forEach((opt, idx) => {
                            const btn = document.createElement('button');
                            btn.className = "corner-btn rounded-xl py-3 text-sm md:text-base font-black";
                            btn.innerText = opt;
                            btn.onclick = () => executeStudentKick(idx === d.activeQuestion.correct, d.activeShooter, d.activeTeamId);
                            corners.appendChild(btn);
                        });
                    }
                    switchStudentTab('shoot');
                } else {
                    shootBtn.disabled = true;
                    shootBtn.className = "bg-slate-800 text-slate-500 py-3 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed opacity-50 shadow";
                    shootBtn.innerText = "⚽ أيقونة التسديد (مظللة / مغلقة)";

                    banner.innerText = d.lastShotResult || "🔒 البطولة مغلقة حالياً في انتظار المعلم...";
                    switchStudentTab('watch');
                }
            });
        }

        function executeStudentKick(isCorrect, shooterName, teamId) {
            playWhistle();
            let resultMsg = '';
            if (isCorrect) {
                const tIdx = (teamId || 1) - 1;
                if (state.teams[tIdx]) state.teams[tIdx].score = (state.teams[tIdx].score || 0) + 1;
                resultMsg = `🎉 جوووووول! سجل البطل (${shooterName}) هدفاً رائعاً!`;
                alert(resultMsg);
            } else {
                resultMsg = `❌ ضاعت الركلة! ارتطمت كرة البطل (${shooterName}) بالقائم!`;
                alert(resultMsg);
            }

            if (db) {
                db.ref('akkour_penalty_v6').update({
                    isShootingOpen: false,
                    activeShooter: '',
                    teams: state.teams,
                    lastShotResult: resultMsg
                });
            }
            switchStudentTab('watch');
        }

        function playWhistle() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.frequency.setValueAtTime(2800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(3200, audioCtx.currentTime + 0.15);
                g.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        renderHome();
    </script>
</body>
</html>
