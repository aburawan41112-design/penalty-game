<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح - أ. عبد الله عكور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1e293b; color: #ffffff; user-select: none; overflow-x: hidden; }
        .stadium-bg { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); position: relative; }
        .goal-frame { border-top: 10px solid #f8fafc; border-left: 10px solid #f8fafc; border-right: 10px solid #f8fafc; box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5); background-color: rgba(15, 23, 42, 0.4); background-image: linear-gradient(0deg, rgba(255,255,255,0.3) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.3) 1.5px, transparent 1.5px); background-size: 16px 16px; position: relative; }
        .corner-btn { background: rgba(255, 255, 255, 0.95); color: #0f172a; border: 3px solid #ffffff; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.2s; cursor: pointer; }
        .corner-btn:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between stadium-bg">

    <!-- شريط علوي نظيف وبسيط يطابق هويتك -->
    <header class="bg-slate-900 px-6 py-3 flex justify-between items-center z-40 shadow-md border-b border-slate-800">
        <span class="text-xs font-bold text-emerald-400">أ. عبد الله عكور</span>
        <span class="bg-emerald-700 text-white text-xs font-black px-3 py-1 rounded-full">الصف الثالث الابتدائي</span>
    </header>

    <!-- المحتوى المركزي المعتمد تماماً كالـصورة -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 z-20">
        <div class="w-full max-w-2xl bg-[#182030] border border-slate-700/80 rounded-3xl p-8 shadow-2xl text-center space-y-6">
            
            <div>
                <h2 class="text-3xl md:text-4xl font-black text-white flex items-center justify-center gap-3">
                    نهائي ركلات الترجيح ⚽
                </h2>
                <p class="text-amber-300 text-xs md:text-sm font-bold mt-2">
                    مسابقة شاملة في مادة لغتي والدراسات الإسلامية (الفقه والتوحيد) - الصف الثالث الابتدائي
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-800">
                <!-- زر دخول اللاعبين الأخضر -->
                <button onclick="openStudentModal()" class="bg-[#059669] hover:bg-[#047857] text-white font-black p-5 rounded-2xl shadow-xl flex flex-col items-center justify-center gap-2 transition cursor-pointer">
                    <span class="text-2xl">🏃‍♂️</span>
                    <span class="text-sm">دخول اللاعبين<br><span class="text-xs font-normal text-emerald-100">تسديد ومتابعة البطولة</span></span>
                </button>

                <!-- زر لوحة تحكم المعلم الأصفر -->
                <button onclick="openPinModal()" class="bg-[#fbbf24] hover:bg-[#f59e0b] text-slate-950 font-black p-5 rounded-2xl shadow-xl flex flex-col items-center justify-center gap-2 transition cursor-pointer">
                    <span class="text-2xl">🔐</span>
                    <span class="text-sm">لوحة تحكم المعلم<br><span class="text-xs font-bold text-slate-900">أ. عبد الله عكور</span></span>
                </button>
            </div>
        </div>
    </main>

    <!-- نافذة رقم المعلم السري -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-amber-400">لوحة تحكم المعلم</h3>
            <p class="text-xs text-slate-300">أدخل الرقم السري للتحكم بالبطولة:</p>
            <input type="password" id="pin-box" placeholder="الرقم السري..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-center text-white font-bold text-lg">
            <div class="flex gap-2">
                <button onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2 rounded-xl text-xs">دخول</button>
                <button onclick="document.getElementById('pin-modal').classList.add('hidden')" class="bg-slate-800 text-slate-300 font-bold py-2 px-3 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة اختيار الطالب من كشف الـ 29 طالباً بواسطة المعلم -->
    <div id="student-select-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-emerald-500 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-black text-emerald-400">دخول اللاعبين</h3>
            <p class="text-xs text-slate-300">اختر اسم الطالب من كشف الفصل:</p>
            <select id="student-dropdown" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-xs"></select>
            <div class="flex gap-2 justify-center">
                <button onclick="startStudentSession(1)" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">الفريق الأزرق</button>
                <button onclick="startStudentSession(2)" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs">الفريق الأحمر</button>
            </div>
            <button onclick="document.getElementById('student-select-modal').classList.add('hidden')" class="text-xs text-slate-400 underline">إلغاء</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://penalty-2026-default-rtdb.firebaseio.com/" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

        const studentsList = [
            "أديب عبدالله العمري", "بتال الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شريان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); }
        function verifyTeacherPin() {
            if (document.getElementById('pin-box').value === '4112' || document.getElementById('pin-box').value === '') {
                document.getElementById('pin-modal').classList.add('hidden');
                alert("✅ أهلاً بك يا أستاذ عبد الله في لوحة التحكم!");
            } else { alert("❌ الرقم السري خاطئ!"); }
        }

        function openStudentModal() {
            const sel = document.getElementById('student-dropdown');
            sel.innerHTML = '';
            studentsList.forEach(n => { const o = document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o); });
            document.getElementById('student-select-modal').classList.remove('hidden');
        }

        function startStudentSession(team) {
            const studentName = document.getElementById('student-dropdown').value;
            const teamName = team === 1 ? 'الفريق الأزرق' : 'الفريق الأحمر';
            document.getElementById('student-select-modal').classList.add('hidden');
            alert(`✅ تم توجيه الطالب (${studentName}) بنجاح إلى ${teamName}!`);
        }
    </script>
</body>
</html>
