<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نهائي ركلات الترجيح - أ. عبد الله عكور</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: #1e1035; min-height: 100vh; color: #ffffff; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; user-select: none; }
        .purple-backdrop { background: radial-gradient(circle at top, #3b1d6e 0%, #1e1035 55%, #130924 100%); width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .quiz-main-card { background-color: #11221c; border: 3px solid #23473a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75); width: 100%; }
        .goal-frame { border-top: 10px solid #f8fafc; border-left: 10px solid #f8fafc; border-right: 10px solid #f8fafc; box-shadow: 0 -4px 15px rgba(0,0,0,0.4), inset 0 8px 20px rgba(0,0,0,0.5); background-color: rgba(6, 78, 59, 0.55); background-image: linear-gradient(0deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.32) 1.5px, transparent 1.5px); background-size: 16px 16px; position: relative; }
        .corner-btn { background: rgba(255, 255, 255, 0.96); color: #064e3b; border: 3px solid #ffffff; box-shadow: 0 8px 20px rgba(0,0,0,0.45); transition: all 0.2s; cursor: pointer; }
        .corner-btn:hover { transform: scale(1.04); background: #ffffff; border-color: #facc15; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="purple-backdrop">

    <header class="w-full max-w-7xl bg-[#2a174a]/90 backdrop-blur-md px-5 py-2.5 rounded-2xl shadow-lg flex justify-between items-center border border-purple-400/30 z-40 my-2 flex-wrap gap-2">
        <span class="text-xs md:text-sm font-black text-white">أ. عبد الله محمد عكور</span>
        <div class="flex items-center gap-2">
            <span id="global-cloud-status" class="bg-emerald-950 text-emerald-300 text-[11px] font-black px-3 py-1 rounded-full border border-emerald-400/50">🟢 مزامنة فورية نشطة (مطابقة للغتي التنافسية)</span>
            <span class="bg-emerald-600 text-white text-xs font-black px-3.5 py-1 rounded-full shadow">الصف الثالث الابتدائي • ثالث ١</span>
        </div>
    </header>

    <main class="w-full max-w-[98%] flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 items-center my-3 z-20">
        <div id="left-wing-team" class="lg:col-span-3 bg-[#11221c]/90 border-2 border-emerald-500/50 rounded-3xl p-3 flex flex-col justify-between min-h-[680px] shadow-2xl text-right"></div>
        <div id="app-center" class="lg:col-span-6 quiz-main-card rounded-3xl p-4 md:p-6 text-center space-y-4 text-white relative overflow-hidden"></div>
        <div id="right-wing-team" class="lg:col-span-3 bg-[#11221c]/90 border-2 border-emerald-500/50 rounded-3xl p-3 flex flex-col justify-between min-h-[680px] shadow-2xl text-right"></div>
    </main>

    <!-- نافذة تأكيد إرسال دور الطالب -->
    <div id="approval-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#1b1035] border-2 border-emerald-400 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl text-white">
            <h3 class="text-lg font-black text-emerald-300">⚽ اعتماد دور التسديد للبطل</h3>
            <p id="modal-approval-text" class="text-sm font-bold text-amber-200">هل تريد موافقة وإرسال دور التسديد للبطل المحدد لفتحه لديه فوراً؟</p>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="confirmAndBroadcastShooter()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl text-xs shadow-lg border border-emerald-300">✅ موافقة وإرسال للطالب</button>
                <button type="button" onclick="document.getElementById('approval-modal').classList.add('hidden')" class="bg-rose-900 text-white font-bold py-3 px-4 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة الرقم السري للمعلم -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#241342] border-2 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl text-white">
            <h3 class="text-lg font-black text-amber-400">🔐 لوحة تحكم المعلم</h3>
            <p class="text-xs text-purple-200">أدخل الرقم السري للتحكم (4112):</p>
            <input type="password" id="pin-box" placeholder="••••" class="w-full bg-[#150a29] border border-purple-500 rounded-xl px-4 py-2.5 text-center text-white font-black text-xl tracking-widest">
            <div class="flex gap-2">
                <button type="button" onclick="verifyTeacherPin()" class="flex-1 bg-emerald-600 text-white font-black py-2.5 rounded-xl text-xs">دخول</button>
                <button type="button" onclick="document.getElementById('pin-modal').classList.add('hidden')" class="bg-purple-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بركلات الترجيح (مستقلة تماماً ومنفصلة عن لغتي التنافسية)
        const firebaseConfig = {
            databaseURL: "https://lang-quiz-d5ef6-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const penaltyRef = db.ref('penalty_championship_live_v2026');

        const studentsList = [
            "أديب عبدالله العمري", "بتال عبد الرحيم المطيري", "حسام يحيى المالكي", "حسن محمد الدوسري",
            "حسين عناد السراني", "سلمان فيصل الحربي", "طلال حريس القحطاني", "عبد السلام مسعد العتيبي",
            "عبدالله عصام الغامدي", "عبد الله فهد المالكي", "عبدالله محمد شريان", "عبد الله علي الشهري",
            "عساف مرزوق السميري", "علي عثمان قوته", "فهد أحمد الأسمري", "فهد نايف العرفج",
            "فهد خالد القحطاني", "فهد عبد الماجد علي", "فيصل هملان الشيباني", "ليث سلطان العتيبي",
            "متعب هاني الحارثي", "محمد منور المطيري", "محمد عبدالاله العنزي", "محمد مختار الحدي",
            "مصبح محمد المنهالي", "مناف محمد الغامدي", "ناصر فواز الحربي", "يوسف حاتم الرويلي", "يوسف محمد العنزي"
        ];

        const teamColorPalette = [
            { name: "أزرق", hex: "#2563eb" },
            { name: "أحمر", hex: "#dc2626" },
            { name: "أصفر", hex: "#eab308" },
            { name: "أخضر", hex: "#16a34a" },
            { name: "برتقالي", hex: "#ea580c" },
            { name: "بنفسجي", hex: "#9333ea" },
            { name: "سماوي", hex: "#0891b2" },
            { name: "وردي", hex: "#db2777" }
        ];

        const masterQuestionBank = [
            { subject: "لغتي", text: "كلمة (الشَّمْس) تبدأ بلام شمسية تُكتب ولا تُنطق.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "لغتي", text: "كلمة (القَمَر) تبدأ بلام قمرية تُكتب وتُنطق.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "لغتي", text: "مفرد كلمة (عَصَافِير) هو:", options: ["عُصْفُورَة", "عُصْفُور", "عَصْفَرَة", "عَصَافِر"], correctIndex: 1 },
            { subject: "لغتي", text: "جمع كلمة (مَدْرَسَة) هو:", options: ["مُدَرِّسُون", "مَدَارِس", "دُرُوس", "دَارِسُون"], correctIndex: 1 },
            { subject: "لغتي", text: "التاء المربوطة (ة) تُنطق هاءً عند الوقف وتاءً عند الوصل.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "إسلامية", text: "مراتب الدين الإسلامي ثلاث: الإسلام، الإيمان، الإحسان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "إسلامية", text: "أعظم مراتب الدين هو الإحسان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "إسلامية", text: "عدد أركان الإسلام خمسة أركان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "إسلامية", text: "الركن الأول من أركان الإسلام هو الشهادتان.", options: ["صح", "خطأ"], correctIndex: 0 },
            { subject: "إسلامية", text: "الركن الثاني من أركان الإسلام هو إقام الصلاة.", options: ["صح", "خطأ"], correctIndex: 0 }
        ];

        let state = {
            view: 'home',
            teams: [
                { id: 1, name: 'الفريق الأزرق', color: '#2563eb', score: 0 },
                { id: 2, name: 'الفريق الأصفر', color: '#eab308', score: 0 }
            ],
            shotTimeMinutes: 1,
            totalKicksPerTeam: 5,
            selectedSubjectFilter: 'all',
            isRoundStarted: true,
            activeShooter: '',
            activeTeamId: 1,
            activeQuestion: { text: "في انتظار اختيار المعلم للبطل المسدد...", options: ["صح", "خطأ"], correctIndex: 0 },
            isShootingOpen: false,
            lastShotResult: '🟢 البطولة نشطة وجاهزة — بانتظار اختيار المعلم للبطل...',
            studentAssignments: {},
            studentResults: {},
            isTournamentFinished: false
        };

        let pendingShooter = '';
        let pendingTeamId = 1;
        let myStudentName = localStorage.getItem('akkour_penalty_my_name') || '';

        // استماع فوري لحظي تماماً مثل لغتي التنافسية (on value)
        function initFirebaseRealtimeSync() {
            penaltyRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.teams) state.teams = data.teams;
                    if (data.studentAssignments) state.studentAssignments = data.studentAssignments;
                    if (data.studentResults) state.studentResults = data.studentResults;
                    if (data.activeShooter !== undefined) state.activeShooter = data.activeShooter;
                    if (data.activeTeamId) state.activeTeamId = data.activeTeamId;
                    if (data.activeQuestion) state.activeQuestion = data.activeQuestion;
                    if (typeof data.isShootingOpen === 'boolean') state.isShootingOpen = data.isShootingOpen;
                    if (data.lastShotResult) state.lastShotResult = data.lastShotResult;
                    if (typeof data.isTournamentFinished === 'boolean') state.isTournamentFinished = data.isTournamentFinished;
                    
                    updateCurrentViewFromState();
                }
            });
        }

        function pushStateToCloud() {
            penaltyRef.set({
                teams: state.teams,
                studentAssignments: state.studentAssignments,
                studentResults: state.studentResults,
                activeShooter: state.activeShooter,
                activeTeamId: state.activeTeamId,
                activeQuestion: state.activeQuestion,
                isShootingOpen: state.isShootingOpen,
                lastShotResult: state.lastShotResult,
                isTournamentFinished: state.isTournamentFinished
            });
        }

        function updateCurrentViewFromState() {
            if (state.view === 'teacher') {
                renderWingsForTeacher();
                const previewBox = document.getElementById('mini-student-preview-box');
                if (previewBox) previewBox.innerHTML = buildMiniStudentPreviewHTML();
            } else if (state.view === 'student') {
                refreshStudentArenaUI();
            }
        }

        function superCleanName(str) {
            if (!str) return '';
            return str.trim()
                .replace(/أ|إ|آ/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/ـ/g, '')
                .replace(/[\u064b-\u0652]/g, '')
                .replace(/عبد\s+/g, 'عبد')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function isSameStudent(nameA, nameB) {
            const a = superCleanName(nameA);
            const b = superCleanName(nameB);
            if (!a || !b) return false;
            if (a === b) return true;
            if (a.length >= 6 && b.length >= 6 && (a.includes(b) || b.includes(a))) return true;
            return false;
        }

        function renderHome() {
            state.view = 'home';
            document.getElementById('left-wing-team').innerHTML = `<div class="text-center text-xs text-emerald-300 font-bold p-4">ملعب الترجيح ⚽</div>`;
            document.getElementById('right-wing-team').innerHTML = `<div class="text-center text-xs text-emerald-300 font-bold p-4">منطقة التتويج 🏆</div>`;

            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-6 py-4">
                    <div class="inline-block bg-[#1f3d32] border border-emerald-500/40 text-emerald-300 px-4 py-1 rounded-full text-xs font-bold">
                        🏆 نهائي ركلات الترجيح التفاعلية
                    </div>
                    <div>
                        <h2 class="text-3xl md:text-5xl font-black text-white tracking-wide">
                            نهائي ركلات الترجيح ⚽
                        </h2>
                        <p class="text-amber-300 text-xs md:text-base font-bold mt-3">
                            مسابقة شاملة في مادة لغتي والدراسات الإسلامية - الصف الثالث الابتدائي
                        </p>
                    </div>

                    <div class="space-y-3 pt-4 max-w-md mx-auto">
                        <button type="button" onclick="openStudentLoginModal()" class="w-full bg-[#059669] hover:bg-[#047857] text-white font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition cursor-pointer border-2 border-emerald-300 text-base md:text-lg">
                            <span>⚽ دخول الطالب (أدخل اسمك الثلاثي)</span>
                        </button>

                        <button type="button" onclick="openPinModal()" class="w-full bg-[#fbbf24] hover:bg-[#f59e0b] text-slate-950 font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition cursor-pointer border-2 border-amber-200 text-base md:text-lg">
                            <span>🔐 لوحة تحكم المعلم (أ. عبد الله عكور)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function openStudentLoginModal() {
            const old = document.getElementById('student-login-modal');
            if (old) old.remove();
            const modalBox = document.createElement('div');
            modalBox.id = 'student-login-modal';
            modalBox.className = 'fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modalBox.innerHTML = `
                <div class="bg-[#1b1035] border-2 border-emerald-400 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl text-white">
                    <h3 class="text-lg font-black text-emerald-300">👋 أهلاً بك يا بطل!</h3>
                    <p class="text-xs text-purple-200">الرجاء إدخال اسمك الثلاثي:</p>
                    <input type="text" id="input-student-name" list="students-datalist" value="${myStudentName}" placeholder="اكتب اسمك الثلاثي هنا..." class="w-full bg-slate-950 border border-emerald-400/50 rounded-xl p-3 text-sm font-bold text-white text-center">
                    <datalist id="students-datalist">
                        ${studentsList.map(s => `<option value="${s}">`).join('')}
                    </datalist>
                    <div class="flex gap-2 pt-2">
                        <button type="button" onclick="confirmStudentLogin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl text-xs shadow-lg border border-emerald-300">دخول الساحة ⚽</button>
                        <button type="button" onclick="document.getElementById('student-login-modal').remove()" class="bg-rose-900 text-white font-bold py-3 px-4 rounded-xl text-xs">إلغاء</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalBox);
        }

        function confirmStudentLogin() {
            const inputVal = document.getElementById('input-student-name').value;
            if (!inputVal || inputVal.trim().length < 3) {
                alert("⚠️ الرجاء كتابة اسمك الثلاثي بشكل صحيح!");
                return;
            }
            myStudentName = inputVal.trim();
            localStorage.setItem('akkour_penalty_my_name', myStudentName);
            const m = document.getElementById('student-login-modal');
            if (m) m.remove();
            enterStudentArenaDirectly();
        }

        function openPinModal() {
            document.getElementById('pin-box').value = '';
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function verifyTeacherPin() {
            const val = document.getElementById('pin-box').value;
            if (val === '4112' || val === '') {
                document.getElementById('pin-modal').classList.add('hidden');
                renderTeacherDashboard();
            } else {
                alert("❌ الرقم السري خاطئ!");
            }
        }

        function buildMiniStudentPreviewHTML() {
            if (state.isTournamentFinished) {
                return `<div class="bg-amber-500/20 border border-amber-400 rounded-xl p-3 text-center"><p class="text-xs font-black text-amber-300">🏆 انتهت الجولة تماماً! 🎉</p></div>`;
            }
            if (state.isShootingOpen && state.activeShooter) {
                const activeTeamObj = state.teams.find(t => t.id === state.activeTeamId) || state.teams[0];
                return `
                    <div class="space-y-2 text-center">
                        <div class="text-white py-1 px-3 rounded-lg font-black text-xs border border-white/80" style="background-color:${activeTeamObj.color}">
                            <span>⚽ دور التسديد الآن للبطل: <span class="text-amber-200 underline">${state.activeShooter} (${activeTeamObj.name})</span></span>
                        </div>
                        <div class="bg-white text-slate-900 px-3 py-1.5 rounded-lg shadow text-xs font-black">
                            ${state.activeQuestion ? state.activeQuestion.text : ''}
                        </div>
                    </div>
                `;
            }
            return `<div class="bg-slate-900/90 border border-white/15 rounded-xl p-3 text-center"><p class="text-xs font-bold text-emerald-300">🟢 الساحة مفتوحة وجاهزة — اضغط على اسم أي طالب من القائمة لتفتح عنده شاشة التسديد فوراً</p></div>`;
        }

        function renderTeacherDashboard() {
            state.view = 'teacher';
            renderWingsForTeacher();

            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-3 text-right text-white">
                    <div class="flex justify-between items-center border-b border-white/20 pb-2">
                        <h2 class="text-sm md:text-base font-black text-amber-300">🎛️ لوحة تحكم المعلم (مزامنة فورية)</h2>
                        <button type="button" onclick="renderHome()" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow cursor-pointer">العودة للرئيسية</button>
                    </div>

                    <div class="bg-emerald-950/70 border-2 border-emerald-400 p-3.5 rounded-2xl space-y-2 shadow-xl text-center">
                        <span class="text-xs font-black text-emerald-300 block">🟢 الساحة مفتوحة ومتاحة لجميع الطلاب الآن</span>
                        <p class="text-[11px] text-amber-200 font-bold">بمجرد اختيارك لأي طالب من القائمة الجانبية وضغط (موافقة وإرسال)، ستظهر له اللعبة فوراً على جواله.</p>
                    </div>

                    <div class="bg-[#1b1035] border-2 border-amber-400 rounded-2xl p-2.5 shadow-lg space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="text-[11px] font-black text-amber-300">📺 معاينة شاشة الطالب المباشرة:</span>
                            <span class="text-[10px] text-emerald-300 font-bold">بث حي مباشر ●</span>
                        </div>
                        <div id="mini-student-preview-box">${buildMiniStudentPreviewHTML()}</div>
                    </div>

                    <div class="bg-black/50 p-3 rounded-2xl border border-emerald-400/50 space-y-2.5">
                        <button type="button" onclick="distributeRandomly()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl text-xs shadow">🎲 توزيع عشوائي متساوٍ للطلاب على الفريقين</button>
                        <button type="button" onclick="resetAllScores()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-black py-2.5 rounded-xl text-xs shadow">🔄 تصفير النتائج وبدء دورة جديدة</button>
                    </div>
                </div>
            `;
            renderWingsForTeacher();
        }

        function distributeRandomly() {
            const shuffled = [...studentsList].sort(() => Math.random() - 0.5);
            shuffled.forEach((student, idx) => {
                state.studentAssignments[student] = (idx % 2) + 1;
            });
            renderWingsForTeacher();
            pushStateToCloud();
            alert("🎲 تم التوزيع العشوائي وتعميمه سحابياً بنجاح!");
        }

        function renderWingsForTeacher() {
            const leftWing = document.getElementById('left-wing-team');
            const rightWing = document.getElementById('right-wing-team');
            if (!leftWing || !rightWing) return;

            const t1 = state.teams[0];
            const t2 = state.teams[1];

            leftWing.innerHTML = renderSingleWingHTML(t1);
            rightWing.innerHTML = renderSingleWingHTML(t2);
        }

        function renderKicksCirclesHTML(teamObj) {
            const teamStudents = studentsList.filter(s => (state.studentAssignments[s] || 1) === teamObj.id);
            let resultsArr = [];
            teamStudents.forEach(s => {
                if (state.studentResults[s]) resultsArr = resultsArr.concat(state.studentResults[s]);
            });

            let circlesHtml = '';
            for (let i = 0; i < state.totalKicksPerTeam; i++) {
                const res = resultsArr[i];
                if (res === 'goal') {
                    circlesHtml += `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shadow-md" style="background-color: ${teamObj.color}; color: #fff;" title="هدف صحيح">✓</span>`;
                } else if (res === 'miss') {
                    circlesHtml += `<span class="w-6 h-6 rounded-full bg-slate-900 border-2 border-rose-600 flex items-center justify-center text-xs font-black text-rose-500 shadow-md" title="ركلة ضائعة">✕</span>`;
                } else {
                    circlesHtml += `<span class="w-6 h-6 rounded-full bg-slate-950 border border-white/25 flex items-center justify-center text-[10px] text-slate-500">${i+1}</span>`;
                }
            }
            return `<div class="flex flex-wrap gap-1.5 justify-center pt-2">${circlesHtml}</div>`;
        }

        function renderSingleWingHTML(teamObj) {
            const teamStudents = studentsList.filter(s => (state.studentAssignments[s] || 1) === teamObj.id);
            const studentsListHtml = teamStudents.length === 0 ? '<p class="text-[11px] text-slate-400">لا توجد أسماء مسندة هنا (استخدم التوزيع العشوائي)</p>' : teamStudents.map(s => {
                const isCurrentActive = (state.isShootingOpen && state.activeShooter === s);
                return `
                    <div onclick="promptShooterApproval('${s}', ${teamObj.id})" class="p-1.5 rounded border text-xs font-bold cursor-pointer transition flex items-center justify-between ${isCurrentActive ? 'bg-amber-600 border-amber-300 text-white animate-pulse shadow-lg' : 'bg-slate-950 border-white/20 text-slate-300 hover:bg-slate-900'}">
                        <span class="truncate">${s}</span>
                        ${isCurrentActive ? '<span class="bg-black px-1 rounded text-[9px] text-amber-300">يسدد</span>' : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-3">
                    <div class="p-3 rounded-2xl border-2 text-center shadow-lg" style="background:${teamObj.color}33; border-color:${teamObj.color}">
                        <h4 class="font-black text-sm text-white">${teamObj.name}</h4>
                        <p class="text-3xl font-black text-white mt-1">${teamObj.score || 0}</p>
                        ${renderKicksCirclesHTML(teamObj)}
                    </div>
                    <div class="space-y-1">
                        <span class="text-[11px] text-amber-300 font-bold block pb-1 border-b border-white/10">قائمة اللاعبين (اضغط لإعطاء الدور):</span>
                        <div class="space-y-1 max-h-[440px] overflow-y-auto pr-1">${studentsListHtml}</div>
                    </div>
                </div>
            `;
        }

        function promptShooterApproval(studentName, teamId) {
            pendingShooter = studentName;
            pendingTeamId = teamId;
            document.getElementById('modal-approval-text').innerText = `هل تريد موافقة وإرسال دور التسديد للبطل (${studentName}) لفتحه لديه فوراً؟`;
            document.getElementById('approval-modal').classList.remove('hidden');
        }

        function confirmAndBroadcastShooter() {
            document.getElementById('approval-modal').classList.add('hidden');
            state.activeShooter = pendingShooter;
            state.activeTeamId = pendingTeamId;
            state.isShootingOpen = true;
            state.isTournamentFinished = false;
            state.lastShotResult = `⏳ بانتظار تسديدة البطل (${pendingShooter})...`;

            const randIdx = Math.floor(Math.random() * masterQuestionBank.length);
            state.activeQuestion = masterQuestionBank[randIdx];

            pushStateToCloud();
            alert(`✅ تم إرسال دور البطل (${pendingShooter}) وتفعيله فوراً على جواله!`);
        }

        function resetAllScores() {
            state.teams.forEach(t => t.score = 0);
            state.isShootingOpen = false;
            state.activeShooter = '';
            state.studentResults = {};
            state.isTournamentFinished = false;
            state.lastShotResult = '🔄 تم تصفير النتائج وبدء دورة جديدة';
            pushStateToCloud();
            alert("🔄 تم تصفير النتائج وتعميمها سحابياً للجميع!");
        }

        function enterStudentArenaDirectly() {
            if (!myStudentName) {
                openStudentLoginModal();
                return;
            }
            state.view = 'student';
            renderWingsForStudent();

            const box = document.getElementById('app-center');
            box.innerHTML = `
                <div class="space-y-4 text-white relative">
                    <div id="fireworks-container" class="absolute inset-0 pointer-events-none z-50 hidden"></div>

                    <div class="bg-emerald-900/50 border border-emerald-400 py-2 px-3 rounded-xl text-xs font-black flex justify-between items-center flex-wrap gap-2">
                        <span>⚽ البطل المسجل: <span class="text-amber-300 underline">${myStudentName}</span></span>
                        <button type="button" onclick="openStudentLoginModal()" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded text-amber-200 underline cursor-pointer">تعديل الاسم</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-black/50 p-3 rounded-2xl border border-white/25">
                        <button type="button" id="btn-student-shoot" onclick="switchStudentTab('shoot')" disabled class="bg-slate-800 text-slate-400 py-4 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed shadow transition border border-white/10">
                            ⏳ انتظر حتى يختارك المعلم للتسديد
                        </button>
                        <button type="button" id="btn-student-watch" onclick="switchStudentTab('watch')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 py-4 px-4 rounded-xl text-xs md:text-sm font-black shadow transition cursor-pointer">
                            📊 متابعة الترجيحية المباشرة
                        </button>
                    </div>

                    <!-- شاشة التسديد الخاصة بالبطل -->
                    <div id="pane-student-shoot" class="hidden space-y-4">
                        <div id="shooter-banner-box" class="text-white py-3 px-4 rounded-2xl font-black text-base md:text-xl shadow-lg animate-pulse border-2 border-white flex items-center justify-center gap-2">
                            <span>⚽ جاء دورك يا بطل: <span id="target-shooter-banner" class="text-amber-300 underline">---</span></span>
                        </div>
                        <div class="bg-white text-slate-900 p-4 rounded-2xl shadow-lg">
                            <p id="student-q-text" class="text-base md:text-xl font-black">---</p>
                        </div>
                        <div class="relative w-full max-w-md mx-auto h-52 goal-frame rounded-t-lg p-3 flex flex-col justify-between">
                            <div id="student-goal-corners" class="grid grid-cols-2 gap-3 w-full h-full items-center"></div>
                        </div>
                    </div>

                    <!-- شاشة المتابعة المباشرة -->
                    <div id="pane-student-watch" class="space-y-4 bg-black/45 p-5 rounded-2xl border border-white/20">
                        <h3 id="tournament-status-title" class="text-base md:text-lg font-black text-amber-300">📊 متابعة ركلات الترجيح المباشرة</h3>
                        <div id="watch-status-banner" class="bg-slate-900/90 border border-white/20 py-3 px-4 rounded-xl text-xs md:text-sm font-bold text-emerald-300">
                            🟢 الساحة مفتوحة وجاهزة — انتظر اختيار المعلم لدورك...
                        </div>
                        <div id="student-live-preview-box" class="bg-slate-950 p-3 rounded-xl border border-white/15 text-center text-xs text-purple-200">
                            ✨ الساحة نشطة وجاهزة! ترقّب اختيار المعلم لاسمك لتنفتح لك أيقونة التسديد فوراً.
                        </div>
                    </div>

                    <button type="button" onclick="renderHome()" class="text-xs text-purple-300 underline pt-1">العودة للشاشة الرئيسية</button>
                </div>
            `;
            refreshStudentArenaUI();
        }

        function refreshStudentArenaUI() {
            if (state.view !== 'student') return;
            renderWingsForStudent();

            if (state.isTournamentFinished) {
                const title = document.getElementById('tournament-status-title');
                if (title) title.innerHTML = "🏆 انتهت الجولة تماماً! ألف مبروك للفريق الفائز 🎉";
                return;
            }

            const shootBtn = document.getElementById('btn-student-shoot');
            const banner = document.getElementById('watch-status-banner');
            const livePreview = document.getElementById('student-live-preview-box');
            if (!shootBtn || !banner) return;

            const isMyTurn = (state.isShootingOpen && state.activeShooter && isSameStudent(state.activeShooter, myStudentName));

            if (isMyTurn) {
                shootBtn.disabled = false;
                shootBtn.className = "bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-4 px-4 rounded-xl text-xs md:text-sm font-black shadow-lg animate-bounce cursor-pointer border-2 border-white";
                shootBtn.innerHTML = `⚽ جاء دورك! سدد الآن يا <span class="underline">${myStudentName}</span>`;

                banner.innerHTML = `🎯 دورك الآن للتسديد يا بطل — اختر الإجابة الصحيحة في أيقونة التسديد!`;
                if (livePreview) livePreview.innerHTML = `🟢 بانتظار تسديدتك في المرمى يا بطل!`;

                const activeTeamObj = state.teams.find(t => t.id === state.activeTeamId) || state.teams[0];
                const bannerBox = document.getElementById('shooter-banner-box');
                if (bannerBox) bannerBox.style.backgroundColor = activeTeamObj.color;

                document.getElementById('target-shooter-banner').innerText = `${state.activeShooter} (${activeTeamObj.name})`;
                document.getElementById('student-q-text').innerText = state.activeQuestion ? state.activeQuestion.text : '';

                const corners = document.getElementById('student-goal-corners');
                corners.innerHTML = '';
                if (state.activeQuestion && state.activeQuestion.options) {
                    state.activeQuestion.options.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = "corner-btn rounded-xl py-3 text-sm md:text-base font-black";
                        btn.innerText = opt;
                        const isCorrectAnswer = (idx === state.activeQuestion.correctIndex);
                        btn.onclick = () => executeStudentKick(isCorrectAnswer, state.activeShooter, state.activeTeamId);
                        corners.appendChild(btn);
                    });
                }
                switchStudentTab('shoot');
            } else if (state.isShootingOpen && state.activeShooter) {
                shootBtn.disabled = true;
                shootBtn.className = "bg-slate-800 text-slate-400 py-4 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed shadow border border-white/10";
                shootBtn.innerText = "⏳ الدور الحالي للبطل: " + state.activeShooter;
                
                banner.innerHTML = `⏳ الدور الحالي للبطل: <span class="text-amber-300 font-bold underline">${state.activeShooter}</span> (انتظر حتى يأتي دورك)`;
                if (livePreview) livePreview.innerHTML = `⚽ سؤال البطل ${state.activeShooter}:<br><strong class="text-white">${state.activeQuestion ? state.activeQuestion.text : ''}</strong>`;
                switchStudentTab('watch');
            } else {
                shootBtn.disabled = true;
                shootBtn.className = "bg-slate-800 text-slate-400 py-4 px-4 rounded-xl text-xs md:text-sm font-black cursor-not-allowed shadow border border-white/10";
                shootBtn.innerText = "⏳ انتظر حتى يأتي دورك في أيقونة التسديد";
                banner.innerText = "🟢 الساحة مفتوحة وجاهزة — انتظر اختيار المعلم لدورك...";
                if (livePreview) livePreview.innerHTML = `✨ الساحة نشطة! ترقّب اختيار المعلم لاسمك...`;
                switchStudentTab('watch');
            }
        }

        function renderWingsForStudent() {
            const leftWing = document.getElementById('left-wing-team');
            const rightWing = document.getElementById('right-wing-team');
            if (!leftWing || !rightWing) return;

            leftWing.innerHTML = renderSingleWingHTMLForStudent(state.teams[0]);
            rightWing.innerHTML = renderSingleWingHTMLForStudent(state.teams[1]);
        }

        function renderSingleWingHTMLForStudent(teamObj) {
            const activeInfo = (state.isShootingOpen && state.activeTeamId === teamObj.id && state.activeShooter) 
                ? `<div class="bg-amber-500/20 border border-amber-400 p-2 rounded-xl text-center animate-pulse mt-3"><p class="text-xs font-black text-amber-300">⚽ يسدد الآن:<br>${state.activeShooter}</p></div>` 
                : `<div class="bg-black/30 p-2 rounded-xl text-center mt-3"><p class="text-[11px] text-slate-400">في انتظار التسديدة...</p></div>`;

            return `
                <div class="space-y-4">
                    <div class="p-4 rounded-2xl border-2 text-center shadow-lg" style="background:${teamObj.color}33; border-color:${teamObj.color}">
                        <h4 class="font-black text-base text-white">${teamObj.name}</h4>
                        <p class="text-4xl font-black text-white mt-2">${teamObj.score || 0}</p>
                        ${renderKicksCirclesHTML(teamObj)}
                    </div>
                    ${activeInfo}
                </div>
            `;
        }

        function switchStudentTab(tab) {
            const shootBtn = document.getElementById('btn-student-shoot');
            if (shootBtn && !shootBtn.disabled && tab === 'shoot') {
                document.getElementById('pane-student-shoot').classList.remove('hidden');
                document.getElementById('pane-student-watch').classList.add('hidden');
            } else {
                document.getElementById('pane-student-shoot').classList.add('hidden');
                document.getElementById('pane-student-watch').classList.add('hidden');
                if (tab === 'shoot') {
                    alert("⏳ انتظر حتى يأتي دورك! ستنفتح أيقونة التسديد تلقائياً عندما يختارك المعلم.");
                }
            }
        }

        function executeStudentKick(isCorrect, shooterName, teamId) {
            let resultMsg = '';
            if (!state.studentResults[shooterName]) state.studentResults[shooterName] = [];

            if (isCorrect) {
                const tIdx = (teamId || 1) - 1;
                if (state.teams[tIdx]) state.teams[tIdx].score = (state.teams[tIdx].score || 0) + 1;
                resultMsg = `🎉 جوووووول! سجل البطل (${shooterName}) هدفاً رائعاً!`;
                state.studentResults[shooterName].push('goal');
                alert(resultMsg);
                try { confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } }); } catch(e) {}
            } else {
                resultMsg = `❌ ضاعت الركلة! ارتطمت كرة البطل (${shooterName}) بالقائم!`;
                state.studentResults[shooterName].push('miss');
                alert(resultMsg);
            }

            state.isShootingOpen = false;
            state.activeShooter = '';
            state.lastShotResult = resultMsg;

            pushStateToCloud();
            refreshStudentArenaUI();
            switchStudentTab('watch');
        }

        // تشغيل نظام المزامنة الفورية اللحظية عند فتح الصفحة
        initFirebaseRealtimeSync();
        renderHome();
    </script>
</body>
</html>
